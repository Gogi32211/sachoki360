<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>sachoki360</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { font-family: 'Noto Sans Georgian', sans-serif; }
.gantt-scroll { overflow-x: auto; }
.bar { border-radius: 4px; height: 22px; cursor: pointer; display: flex; align-items: center;
       padding: 0 6px; font-size: 11px; color: white; font-weight: 600;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.15s; }
.bar:hover { opacity: 0.8; }
.spinner { border: 3px solid #e5e7eb; border-top: 3px solid #3b82f6; border-radius: 50%;
           width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = window.location.origin + "/api";

const SERIES_COLORS = {
  ZT: "#42A5F5", LN: "#66BB6A", KT: "#FF7043", DT1: "#AB47BC", DT2: "#EC407A"
};

const pad2 = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;

function Badge({ series }) {
  return (
    <span className="px-2 py-0.5 rounded text-white text-xs font-bold"
      style={{ background: SERIES_COLORS[series] || "#888" }}>{series}</span>
  );
}

function Spinner() {
  return <div className="flex justify-center p-10"><div className="spinner"/></div>;
}

// ── TIMELINE VIEW ──────────────────────────────────────────────
function TimelineView({ onSelectTour }) {
  const [tours, setTours] = useState([]);
  const [loading, setLoading] = useState(true);
  const [viewDate, setViewDate] = useState(new Date());
  const [filters, setFilters] = useState({ZT:true,LN:true,KT:true,DT1:true,DT2:true});
  const [popup, setPopup] = useState(null);
  const scrollRef = useRef(null);
  const today = new Date();

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month, daysInMonth);

  const MONTH_NAMES = ["იანვარი","თებერვალი","მარტი","აპრილი","მაისი","ივნისი",
    "ივლისი","აგვისტო","სექტემბერი","ოქტომბერი","ნოემბერი","დეკემბერი"];

  useEffect(() => {
    setLoading(true);
    fetch(`${API}/timeline?from_date=${toISO(monthStart)}&to_date=${toISO(monthEnd)}`)
      .then(r => r.json()).then(d => { setTours(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, [year, month]);

  const filtered = tours.filter(t => filters[t.series]);

  const DAY_W = 34, ROW_H = 30, LABEL_W = 130;

  const barProps = (tour) => {
    const bs = new Date(tour.bus_start + "T00:00:00");
    const be = new Date(tour.bus_end + "T00:00:00");
    const s = Math.max(0, Math.round((bs - monthStart) / 86400000));
    const e = Math.min(daysInMonth, Math.round((be - monthStart) / 86400000));
    if (e <= 0 || s >= daysInMonth) return null;
    return { left: s * DAY_W, width: Math.max((e - s) * DAY_W - 2, 10) };
  };

  const handleBarClick = async (tour, e) => {
    e.stopPropagation();
    const checkDate = toISO(today);
    try {
      const data = await fetch(`${API}/tours/${checkDate}`).then(r => r.json());
      const info = data.find(d => d.code === tour.code);
      setPopup({ tour, info, x: Math.min(e.clientX, window.innerWidth-280), y: Math.min(e.clientY+12, window.innerHeight-220) });
    } catch { setPopup({ tour, info: null, x: e.clientX, y: e.clientY+12 }); }
  };

  const scrollToToday = () => {
    if (today.getFullYear() === year && today.getMonth() === month) {
      if (scrollRef.current) scrollRef.current.scrollLeft = (today.getDate()-1) * DAY_W - 200;
    } else { setViewDate(new Date()); }
  };

  return (
    <div className="p-4" onClick={() => setPopup(null)}>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <button onClick={() => setViewDate(new Date(year, month-1, 1))}
          className="px-3 py-1.5 bg-white border rounded hover:bg-gray-50 text-sm">◀</button>
        <span className="font-semibold text-lg min-w-48 text-center">{MONTH_NAMES[month]} {year}</span>
        <button onClick={() => setViewDate(new Date(year, month+1, 1))}
          className="px-3 py-1.5 bg-white border rounded hover:bg-gray-50 text-sm">▶</button>
        <button onClick={scrollToToday}
          className="px-3 py-1.5 bg-amber-400 text-white rounded text-sm font-medium hover:bg-amber-500">📅 დღეს</button>
        <div className="flex gap-2 flex-wrap">
          {Object.keys(SERIES_COLORS).map(s => (
            <label key={s} className="flex items-center gap-1 cursor-pointer text-sm select-none">
              <input type="checkbox" checked={filters[s]}
                onChange={e => setFilters(f => ({...f, [s]: e.target.checked}))} className="rounded"/>
              <span className="px-2 py-0.5 rounded text-white text-xs font-bold"
                style={{background: SERIES_COLORS[s]}}>{s}</span>
            </label>
          ))}
        </div>
      </div>

      {loading ? <Spinner/> : (
        <div className="bg-white rounded-lg shadow overflow-hidden">
          <div ref={scrollRef} className="gantt-scroll">
            <div style={{ minWidth: LABEL_W + daysInMonth * DAY_W }}>
              <div className="flex border-b bg-gray-50 sticky top-0 z-10">
                <div style={{width:LABEL_W,minWidth:LABEL_W}}
                  className="text-xs font-semibold text-gray-500 p-2 border-r shrink-0">ტური</div>
                {Array.from({length: daysInMonth}, (_, i) => {
                  const isTd = today.getFullYear()===year && today.getMonth()===month && today.getDate()===i+1;
                  return (
                    <div key={i} style={{width:DAY_W,minWidth:DAY_W}}
                      className={`text-center text-xs py-2 border-r shrink-0 ${isTd?"bg-amber-100 font-bold text-amber-700":"text-gray-400"}`}>
                      {i+1}
                    </div>
                  );
                })}
              </div>
              {filtered.length === 0 ? (
                <div className="p-10 text-center text-gray-400">ამ თვეში ტურები არ არის</div>
              ) : filtered.map(tour => {
                const bp = barProps(tour);
                return (
                  <div key={tour.code} className="flex border-b hover:bg-gray-50" style={{height:ROW_H}}>
                    <div style={{width:LABEL_W,minWidth:LABEL_W}}
                      className="text-xs font-medium px-2 flex items-center border-r cursor-pointer hover:text-blue-600 truncate shrink-0"
                      onClick={() => onSelectTour(tour.code)}>{tour.code}</div>
                    <div className="relative flex-1">
                      {today.getFullYear()===year && today.getMonth()===month && (
                        <div className="absolute inset-y-0 bg-amber-50"
                          style={{left:(today.getDate()-1)*DAY_W, width:DAY_W}}/>
                      )}
                      {bp && (
                        <div className="bar absolute top-1"
                          style={{left:bp.left, width:bp.width, background:tour.color}}
                          onClick={e => handleBarClick(tour, e)}>{tour.code}</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {popup && (
        <div className="fixed z-50 bg-white border shadow-2xl rounded-xl p-4 text-sm w-64"
          style={{left:popup.x, top:popup.y}} onClick={e => e.stopPropagation()}>
          <div className="flex items-center gap-2 mb-2">
            <Badge series={popup.tour.series}/>
            <span className="font-bold">{popup.tour.code}</span>
            <button className="ml-auto text-gray-400 hover:text-gray-700" onClick={() => setPopup(null)}>✕</button>
          </div>
          <div className="text-xs text-gray-400 mb-3">{popup.tour.bus_start} → {popup.tour.bus_end}</div>
          {popup.info ? (
            <div className="space-y-1 text-xs">
              <div>📍 <strong>{popup.info.city}</strong></div>
              <div>🏨 {popup.info.hotel}</div>
              <div>🍽️ {popup.info.lunch}</div>
              <div>🌙 {popup.info.dinner}</div>
              {popup.info.border_crossing && <div className="text-orange-600">🚧 {popup.info.border_crossing}</div>}
            </div>
          ) : <div className="text-xs text-gray-400">დღეს არ არის აქტიური</div>}
          <button className="mt-3 text-blue-600 text-xs hover:underline"
            onClick={() => { setPopup(null); onSelectTour(popup.tour.code); }}>სრული itinerary →</button>
        </div>
      )}
    </div>
  );
}

// ── DAY VIEW ───────────────────────────────────────────────────
function DayView({ onSelectTour }) {
  const [selDate, setSelDate] = useState(toISO(new Date()));
  const [tours, setTours] = useState([]);
  const [borders, setBorders] = useState([]);
  const [loading, setLoading] = useState(false);

  const load = useCallback(d => {
    setLoading(true);
    Promise.all([
      fetch(`${API}/tours/${d}`).then(r => r.json()),
      fetch(`${API}/border/${d}`).then(r => r.json()),
    ]).then(([t, b]) => { setTours(t); setBorders(b); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  useEffect(() => { load(selDate); }, [selDate]);

  const changeDay = delta => {
    const d = new Date(selDate + "T00:00:00");
    d.setDate(d.getDate() + delta);
    setSelDate(toISO(d));
  };

  const grouped = {};
  for (const t of tours) {
    const c = t.city || "სხვა";
    if (!grouped[c]) grouped[c] = [];
    grouped[c].push(t);
  }

  const displayDate = new Date(selDate + "T00:00:00").toLocaleDateString("ka-GE", {
    weekday:"long", year:"numeric", month:"long", day:"numeric"
  });

  return (
    <div className="p-4 max-w-2xl mx-auto">
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <button onClick={() => changeDay(-1)} className="px-3 py-2 bg-white border rounded hover:bg-gray-50">◀</button>
        <input type="date" value={selDate} onChange={e => setSelDate(e.target.value)}
          className="border rounded px-3 py-2 text-sm"/>
        <button onClick={() => changeDay(1)} className="px-3 py-2 bg-white border rounded hover:bg-gray-50">▶</button>
        <button onClick={() => setSelDate(toISO(new Date()))}
          className="px-3 py-2 bg-amber-400 text-white rounded text-sm font-medium hover:bg-amber-500">📅 დღეს</button>
        <span className="text-gray-500 text-sm">{displayDate}</span>
      </div>

      {loading ? <Spinner/> : tours.length === 0 ? (
        <div className="bg-white rounded-xl shadow p-10 text-center text-gray-400">
          <div className="text-4xl mb-2">📭</div>
          <div className="text-sm">ამ დღეს ტურები არ არის</div>
        </div>
      ) : (
        <>
          {Object.entries(grouped).map(([city, cts]) => (
            <div key={city} className="mb-3 flex gap-3 items-start">
              <div className="w-28 flex-shrink-0 pt-2 text-right">
                <div className="text-sm font-semibold text-gray-700">📍 {city}</div>
                <div className="text-xs text-gray-400">{cts.length} ჯგ.</div>
              </div>
              <div className="flex-1 grid gap-1.5">
                {cts.map(t => (
                  <div key={t.code} className="bg-white rounded-lg shadow-sm border-l-4 px-3 py-2"
                    style={{borderLeftColor: t.color}}>
                    <div className="flex items-start gap-3">
                      <div className="flex flex-col gap-1 items-start flex-shrink-0 pt-0.5">
                        <Badge series={t.series}/>
                        <button className="font-bold text-gray-700 hover:text-blue-600 text-xs"
                          onClick={() => onSelectTour(t.code)}>{t.code}</button>
                      </div>
                      <div className="flex-1 text-xs text-gray-700 space-y-0.5">
                        <div>🏨 {t.hotel && t.hotel.startsWith('? ')
                          ? <span className="text-orange-500 font-semibold">{t.hotel} ⚠</span>
                          : t.hotel}</div>
                        <div>🍽️ <span className="text-gray-400">L:</span> {t.lunch}</div>
                        <div>🌙 <span className="text-gray-400">V:</span> {t.dinner}</div>
                        {t.border_crossing && (
                          <div className="text-orange-600 font-medium">🚧 {t.border_crossing}</div>
                        )}
                      </div>
                      <span className="text-xs text-gray-400 flex-shrink-0">Day {t.day_num}/{t.total_days}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {borders.length > 0 && (
            <div className="mt-4 bg-orange-50 border border-orange-200 rounded-xl p-4">
              <h3 className="font-bold text-orange-700 mb-2 text-sm">🚧 დღის საზ.კვ.</h3>
              {borders.map((b, i) => (
                <div key={i} className="text-sm text-orange-800 mb-1">
                  • <strong>{b.tour_code}</strong>: {b.border_crossing}
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── TOUR DETAIL VIEW ───────────────────────────────────────────
function TourDetailView({ initialCode, onBack }) {
  const [search, setSearch] = useState(initialCode || "");
  const [tour, setTour] = useState(null);
  const [loading, setLoading] = useState(false);
  const [editNotes, setEditNotes] = useState({});
  const [saving, setSaving] = useState({});

  const loadTour = code => {
    if (!code) return;
    setLoading(true);
    fetch(`${API}/tour/${code.toUpperCase()}`)
      .then(r => r.ok ? r.json() : null)
      .then(d => { setTour(d); setLoading(false); })
      .catch(() => setLoading(false));
  };

  useEffect(() => { if (initialCode) loadTour(initialCode); }, [initialCode]);

  const saveNote = async (logId, notes) => {
    setSaving(s => ({...s, [logId]: true}));
    await fetch(`${API}/log/${logId}/note`, {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({notes})
    });
    setSaving(s => ({...s, [logId]: false}));
    setEditNotes(n => { const x={...n}; delete x[logId]; return x; });
    loadTour(tour.code);
  };

  const STATUS = {active:"bg-green-100 text-green-700", upcoming:"bg-blue-100 text-blue-700", done:"bg-gray-100 text-gray-500"};
  const STATUS_GEO = {active:"აქტიური", upcoming:"მომავალი", done:"დასრულებული"};

  return (
    <div className="p-4 max-w-5xl mx-auto">
      <div className="flex items-center gap-3 mb-6 flex-wrap">
        <button onClick={onBack} className="px-3 py-2 bg-white border rounded hover:bg-gray-50 text-sm">← უკან</button>
        <form onSubmit={e => { e.preventDefault(); loadTour(search); }} className="flex gap-2">
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="კოდი: ZT-0601 ..."
            className="border rounded px-3 py-2 text-sm w-44"/>
          <button type="submit"
            className="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">ძებნა</button>
        </form>
      </div>

      {loading ? <Spinner/> : !tour ? (
        <div className="bg-white rounded-xl shadow p-14 text-center text-gray-400">
          <div className="text-5xl mb-3">🔍</div>
          <div>ჩაწერე ტურის კოდი ძებნის ველში</div>
        </div>
      ) : (
        <>
          <div className="bg-white rounded-xl shadow p-5 mb-5">
            <div className="flex items-center gap-3 flex-wrap">
              <Badge series={tour.series}/>
              <h2 className="text-xl font-bold">{tour.code}</h2>
              <span className={`px-2 py-0.5 rounded text-xs font-medium ${STATUS[tour.status]}`}>
                {STATUS_GEO[tour.status]}
              </span>
            </div>
            <div className="text-sm text-gray-500 mt-1">{tour.series_name}</div>
            <div className="text-sm text-gray-600 mt-1">📅 {tour.bus_start} → {tour.bus_end}</div>
          </div>

          <div className="bg-white rounded-xl shadow overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 border-b">
                <tr>{["დღე","თარიღი","ქალაქი","სასტუმრო","სადილი","ვახშამი","საზ.კვ.","შენიშვნა"].map(h => (
                  <th key={h} className="text-left px-3 py-2 text-xs font-semibold text-gray-500 whitespace-nowrap">{h}</th>
                ))}</tr>
              </thead>
              <tbody>
                {tour.days.map(day => (
                  <tr key={day.log_id} className="border-b hover:bg-gray-50">
                    <td className="px-3 py-2 font-bold text-gray-400 text-center">{day.day_num}</td>
                    <td className="px-3 py-2 whitespace-nowrap text-gray-500 text-xs">{day.date}</td>
                    <td className="px-3 py-2 font-medium text-sm">{day.city}</td>
                    <td className="px-3 py-2 text-xs max-w-xs">
                      {day.hotel && day.hotel.startsWith('? ')
                        ? <span className="text-orange-500 font-semibold">{day.hotel} ⚠</span>
                        : <span className="text-gray-600">{day.hotel}</span>}
                    </td>
                    <td className="px-3 py-2 text-gray-600 text-xs">{day.lunch}</td>
                    <td className="px-3 py-2 text-gray-600 text-xs">{day.dinner}</td>
                    <td className="px-3 py-2 text-orange-600 text-xs whitespace-nowrap">{day.border_crossing}</td>
                    <td className="px-3 py-2">
                      {editNotes[day.log_id] !== undefined ? (
                        <div className="flex gap-1">
                          <textarea value={editNotes[day.log_id]}
                            onChange={e => setEditNotes(n => ({...n, [day.log_id]: e.target.value}))}
                            className="border rounded px-2 py-1 text-xs w-28 h-10 resize-none"/>
                          <button onClick={() => saveNote(day.log_id, editNotes[day.log_id])}
                            disabled={saving[day.log_id]}
                            className="px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600 disabled:opacity-50">
                            {saving[day.log_id] ? "…" : "✓"}
                          </button>
                          <button onClick={() => setEditNotes(n => { const x={...n}; delete x[day.log_id]; return x; })}
                            className="px-2 py-1 bg-gray-200 rounded text-xs">✕</button>
                        </div>
                      ) : (
                        <div className="flex items-center gap-1">
                          <span className="text-xs text-gray-400 truncate max-w-20">{day.notes}</span>
                          <button onClick={() => setEditNotes(n => ({...n, [day.log_id]: day.notes || ""}))}
                            className="text-blue-400 hover:text-blue-600 text-xs shrink-0">✏️</button>
                        </div>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

// ── ACCOUNTING VIEW ────────────────────────────────────────────
function AccountingView({ onSelectTour }) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all'); // all, due, active, done
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('bus_start');

  useEffect(() => {
    fetch(`${API}/financials`)
      .then(r => r.json())
      .then(d => { setData(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const filtered = data
    .filter(t => {
      if (filter === 'due') return t.due_gel > 0;
      if (filter === 'active') return t.status === 'active';
      if (filter === 'done') return t.status === 'done';
      return true;
    })
    .filter(t => !search || t.tour_code.toLowerCase().includes(search.toLowerCase()) || (t.guide||'').toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => {
      if (sortBy === 'due_gel') return b.due_gel - a.due_gel;
      if (sortBy === 'profit') return b.profit_gel - a.profit_gel;
      return a.bus_start.localeCompare(b.bus_start);
    });

  const totalDue = data.reduce((s,t) => s + (t.due_gel||0), 0);
  const totalPaid = data.reduce((s,t) => s + (t.paid_gel||0), 0);
  const totalProfit = data.reduce((s,t) => s + (t.profit_gel||0), 0);
  const totalSpent = data.reduce((s,t) => s + (t.spent_gel||0), 0);
  const dueCount = data.filter(t => t.due_gel > 0).length;

  const fmt = (n) => n ? Math.round(n).toLocaleString() + ' ₾' : '—';
  const fmtU = (n) => n ? Math.round(n).toLocaleString() + ' $' : '—';

  return (
    <div className="p-4 max-w-screen-xl mx-auto">
      {/* Summary Cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div className="bg-red-50 border border-red-200 rounded-lg p-4">
          <div className="text-xs text-red-500 font-medium mb-1">გადასახდელი</div>
          <div className="text-2xl font-bold text-red-700">{fmt(totalDue)}</div>
          <div className="text-xs text-red-400 mt-1">{dueCount} ტური</div>
        </div>
        <div className="bg-green-50 border border-green-200 rounded-lg p-4">
          <div className="text-xs text-green-500 font-medium mb-1">გადახდილია</div>
          <div className="text-2xl font-bold text-green-700">{fmt(totalPaid)}</div>
        </div>
        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
          <div className="text-xs text-blue-500 font-medium mb-1">სულ მოგება</div>
          <div className="text-2xl font-bold text-blue-700">{fmt(totalProfit)}</div>
        </div>
        <div className="bg-gray-50 border border-gray-200 rounded-lg p-4">
          <div className="text-xs text-gray-500 font-medium mb-1">სულ დახარჯული</div>
          <div className="text-2xl font-bold text-gray-700">{fmt(totalSpent)}</div>
        </div>
      </div>

        <div className="flex gap-1">
          {[['all','ყველა'],['due','გადასახდელი'],['active','აქტიური'],['done','დასრულ.']].map(([v,l]) => (

          <option value="profit">მოგება</option>

      {loading ? <Spinner/> : (
        <div className="bg-white rounded-lg shadow overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 border-b">
                <tr>
                  {['ტური','გიდი','ოთახები','გამგ.','დახარჯ.','ტ.ფასი','გადახდ.','გადასახ.','მოგება','სტ.'].map(h => (
                    <th key={h} className="text-left px-3 py-2 text-xs font-semibold text-gray-500 whitespace-nowrap">{h}</th>
                  ))}

              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr><td colSpan="10" className="text-center py-12 text-gray-400">მონაცემები არ მოიძებნა</td></tr>
                ) : filtered.map(t => (
                  <tr key={t.tour_code} className={`border-b hover:bg-gray-50 ${t.due_gel > 0 ? 'bg-red-50/30' : ''}`}>
                    <td className="px-3 py-2">
                      <div className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: t.color}}/>
                        <button className="font-bold text-blue-600 hover:underline whitespace-nowrap"
                          onClick={() => onSelectTour(t.tour_code)}>{t.tour_code}</button>
                      </div>
                    </td>
                    <td className="px-3 py-2 text-gray-600 max-w-xs truncate">{t.guide || '—'}</td>
                    <td className="px-3 py-2 text-gray-500 text-xs">{t.rooms || '—'}</td>
                    <td className="px-3 py-2 text-gray-500 whitespace-nowrap">{t.bus_start}</td>
                    <td className="px-3 py-2 text-gray-700 whitespace-nowrap">{fmt(t.spent_gel)}</td>
                    <td className="px-3 py-2 text-gray-700 whitespace-nowrap">{fmtU(t.tour_price_usd)}</td>
                    <td className="px-3 py-2 text-green-700 font-medium whitespace-nowrap">{fmt(t.paid_gel)}</td>
                    <td className="px-3 py-2 whitespace-nowrap">
                      {t.due_gel > 0
                        ? <span className="px-2 py-0.5 bg-red-100 text-red-700 rounded font-bold">{fmt(t.due_gel)}</span>
                        : <span className="text-green-600">✓</span>}
                    </td>
                    <td className={`px-3 py-2 font-medium whitespace-nowrap ${t.profit_gel > 0 ? 'text-green-700' : t.profit_gel < 0 ? 'text-red-600' : 'text-gray-400'}`}>
                      {fmt(t.profit_gel)}
                    </td>
                    <td className="px-3 py-2">
                      <span className={`px-2 py-0.5 rounded text-xs font-medium ${
                        t.status==='active' ? 'bg-green-100 text-green-700' :

                        'bg-gray-100 text-gray-500'}`}>

                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ── PAYMENTS VIEW ─────────────────────────────────────────────
function PaymentsView() {
  const [schedule, setSchedule] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('due_soon');

  const load = () => {
    setLoading(true);
    fetch(`${API}/payments/schedule`)
      .then(r => r.json()).then(d => { setSchedule(d); setLoading(false); })
      .catch(() => setLoading(false));
  };
  useEffect(() => { load(); }, []);

  const svcLabel = t => t === 'hotel' ? 'სასტ.' : t === 'lunch' ? 'ლანჩი' : t === 'dinner' ? 'ვახShami' : 'ტური';

  const filtered = schedule.filter(p =>
    filter === 'all' ? true :
    filter === 'overdue' ? p.status === 'overdue' :
    filter === 'due_soon' ? p.status === 'due_soon' :
    p.status === 'upcoming'
  );

  const grouped = filtered.reduce((acc, item) => {
    if (!acc[item.due_date]) acc[item.due_date] = [];
    acc[item.due_date].push(item);
    return acc;
  }, {});

  const overdueCnt = schedule.filter(p => p.status === 'overdue').length;
  const soonCnt = schedule.filter(p => p.status === 'due_soon').length;
  const upcomingCnt = schedule.filter(p => p.status === 'upcoming').length;

  const vendorIcon = t => t === 'hotel' ? '🏨' : t === 'other' ? '👤' : '🍽️';

  return (
    <div className="p-4 max-w-5xl mx-auto">
      <div className="grid grid-cols-3 gap-3 mb-4">
        <div className="bg-red-50 border border-red-200 rounded-lg px-3 py-2.5 cursor-pointer" onClick={() => setFilter('overdue')}>
          <div className="text-xs text-red-500 mb-0.5">ვადაგადასული</div>
          <div className="text-2xl font-bold text-red-700">{overdueCnt}</div>
        </div>
        <div className="bg-orange-50 border border-orange-200 rounded-lg px-3 py-2.5 cursor-pointer" onClick={() => setFilter('due_soon')}>
          <div className="text-xs text-orange-500 mb-0.5">3 დღეში</div>
          <div className="text-2xl font-bold text-orange-600">{soonCnt}</div>
        </div>
        <div className="bg-blue-50 border border-blue-200 rounded-lg px-3 py-2.5 cursor-pointer" onClick={() => setFilter('upcoming')}>
          <div className="text-xs text-blue-500 mb-0.5">მომდევნო</div>
          <div className="text-2xl font-bold text-blue-700">{upcomingCnt}</div>
        </div>
      </div>

      <div className="flex gap-2 mb-3 flex-wrap">
        {[['all','ყველა'],['overdue','ვადაგადასული'],['due_soon','3 დღეში'],['upcoming','მომდევნო']].map(([v,l]) => (
          <button key={v} onClick={() => setFilter(v)}
            className={`px-3 py-1 rounded text-xs ${filter===v ? 'bg-slate-700 text-white' : 'bg-white border hover:bg-gray-50'}`}>{l}</button>
        ))}
        <button onClick={load} className="ml-auto px-3 py-1 rounded text-xs bg-white border hover:bg-gray-50">↻</button>
      </div>

      {loading ? <Spinner/> : filtered.length === 0 ? (
        <div className="text-center py-16 text-gray-400">
          <div className="text-4xl mb-2">✓</div>
          <div className="text-sm">{schedule.length === 0 ? 'გადახდის პირობები არ არის დაყენებული' : 'გადასახდელი არ არის'}</div>
        </div>
      ) : (
        <div className="flex gap-4 items-start">

          {/* ── Left: payment list (unchanged) ── */}
          <div className="flex-1 space-y-2">
            {Object.entries(grouped).sort(([a],[b]) => a.localeCompare(b)).map(([dueDate, items]) => {
              const diff = items[0].days_until_due;
              const borderCls = diff < 0 ? 'border-red-500' : diff <= 3 ? 'border-orange-400' : 'border-blue-400';
              const headCls = diff < 0 ? 'bg-red-50 text-red-700' : diff <= 3 ? 'bg-orange-50 text-orange-700' : 'bg-blue-50 text-blue-700';
              const diffLabel = diff < 0 ? `${Math.abs(diff)} დღე ვადაგადასული!` : diff === 0 ? 'დღეს!' : `${diff} დღეში`;
              return (
                <div key={dueDate} className={`bg-white rounded-lg shadow-sm overflow-hidden border-l-4 ${borderCls}`}>
                  <div className={`px-3 py-1.5 flex items-center gap-2 text-xs ${headCls}`}>
                    <span className="font-bold">{dueDate}</span>
                    <span className="font-medium">{diffLabel}</span>
                    <span className="ml-auto opacity-60">{items.length} ჩ.</span>
                  </div>
                  <div className="divide-y">
                    {items.map((item, idx) => (
                      <div key={idx} className="px-3 py-2 flex items-center gap-2">
                        <Badge series={item.series}/>
                        <span className="text-xs font-bold text-gray-700 w-16 flex-shrink-0">{item.tour_code}</span>
                        <span className="text-sm flex-shrink-0">{vendorIcon(item.vendor_type)}</span>
                        <span className="text-sm font-medium flex-1 min-w-0 truncate">{item.vendor_name}</span>
                        <span className="text-xs text-gray-400 flex-shrink-0">
                          {item.first_service_date}
                          {item.nights > 1 && `→${item.nights}ღ`}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          {/* ── Right: amounts frame ── */}
          <div className="w-52 flex-shrink-0 sticky top-4">
            <div className="bg-white rounded-lg shadow-sm overflow-hidden">
              <div className="px-3 py-2 bg-gray-800 text-white text-xs font-semibold">გადასახდელი თანხები</div>
              <div className="divide-y">
                {Object.entries(grouped).sort(([a],[b]) => a.localeCompare(b)).map(([dueDate, items]) => {
                  const usd = items.filter(i=>i.currency==='USD'&&i.total_amount>0).reduce((s,i)=>s+i.total_amount,0);
                  const gel = items.filter(i=>i.currency==='GEL'&&i.total_amount>0).reduce((s,i)=>s+i.total_amount,0);
                  if (!usd && !gel) return null;
                  const diff = items[0].days_until_due;
                  const dateCls = diff < 0 ? 'text-red-600' : diff <= 3 ? 'text-orange-600' : 'text-gray-600';
                  return (
                    <div key={dueDate} className="px-3 py-2">
                      <div className={`text-xs font-bold mb-1 ${dateCls}`}>{dueDate}</div>
                      {usd > 0 && <div className="text-sm font-bold text-blue-700">${usd.toFixed(0)}</div>}
                      {gel > 0 && <div className="text-sm font-bold text-emerald-700">₾{gel.toFixed(0)}</div>}
                    </div>
                  );
                })}
              </div>
              {/* Grand totals */}
              {(() => {
                const totalUsd = filtered.filter(i=>i.currency==='USD'&&i.total_amount>0).reduce((s,i)=>s+i.total_amount,0);
                const totalGel = filtered.filter(i=>i.currency==='GEL'&&i.total_amount>0).reduce((s,i)=>s+i.total_amount,0);
                if (!totalUsd && !totalGel) return null;
                return (
                  <div className="px-3 py-2 bg-gray-50 border-t-2 border-gray-200">
                    <div className="text-xs text-gray-500 mb-1 font-semibold">სულ</div>
                    {totalUsd > 0 && <div className="text-base font-bold text-blue-700">${totalUsd.toFixed(0)}</div>}
                    {totalGel > 0 && <div className="text-base font-bold text-emerald-700">₾{totalGel.toFixed(0)}</div>}
                  </div>
                );
              })()}
            </div>
          </div>

        </div>
      )}
    </div>
  );
}

// ── SETTINGS VIEW ──────────────────────────────────────────────
function SettingsView() {
  const EMPTY = {vendor_name:'', vendor_type:'hotel', timing:'after', days_offset:7, notes:'', unit_price:0, currency:'GEL', series_prices:''};
  const [terms, setTerms] = useState([]);
  const [vendors, setVendors] = useState({hotels:[], restaurants:[]});
  const [form, setForm] = useState(EMPTY);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [editId, setEditId] = useState(null);

  const loadAll = () => {
    Promise.all([
      fetch(`${API}/payment-terms`).then(r => r.json()),
      fetch(`${API}/vendors`).then(r => r.json()),
    ]).then(([t, v]) => { setTerms(t); setVendors(v); setLoading(false); })
      .catch(() => setLoading(false));
  };
  useEffect(() => { loadAll(); }, []);

  const save = () => {
    if (!form.vendor_name.trim()) return;
    setSaving(true);
    fetch(`${API}/payment-terms`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({...form, days_offset: parseInt(form.days_offset) || 0, unit_price: parseFloat(form.unit_price) || 0}),
    }).then(() => { loadAll(); setForm(EMPTY); setEditId(null); setSaving(false); });
  };

  const del = id => {
    fetch(`${API}/payment-terms/${id}`, {method:'DELETE'}).then(() => loadAll());
  };

  const startEdit = t => {
    setForm({vendor_name:t.vendor_name, vendor_type:t.vendor_type, timing:t.timing, days_offset:t.days_offset, notes:t.notes||'', unit_price:t.unit_price||0, currency:t.currency||'GEL', series_prices:t.series_prices||''});
    setEditId(t.id);
  };

  const allVendors = [...vendors.hotels.map(h => ({n:h, t:'hotel'})), ...vendors.restaurants.map(r => ({n:r, t:'restaurant'}))];

  return (
    <div className="p-4 max-w-screen-xl mx-auto">
      <div className="bg-white rounded-lg shadow p-5 mb-6">
        <h3 className="font-bold text-base mb-4">{editId ? 'ვენდორის რედაქტირება' : 'ვენდორის დამატება'}</h3>
        <div className="grid grid-cols-1 md:grid-cols-5 gap-3 mb-3">
          <div className="md:col-span-2">
            <label className="text-xs text-gray-500 mb-1 block">სასტუმრო / რესტ. სახელი</label>
            <input list="vendor-list" value={form.vendor_name}
              onChange={e => setForm(f => ({...f, vendor_name: e.target.value}))}
              placeholder="მაგ: Pullman Tbilisi"
              className="border rounded px-3 py-2 text-sm w-full"/>
            <datalist id="vendor-list">
              {allVendors.map(v => <option key={v.n} value={v.n} label={v.t === 'hotel' ? '🏨 '+v.n : '🍽️ '+v.n}/>)}
            </datalist>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">ტიპი</label>
            <select value={form.vendor_type} onChange={e => setForm(f => ({...f, vendor_type: e.target.value}))}
              className="border rounded px-3 py-2 text-sm w-full">
              <option value="hotel">🏨 სასტუმრო</option>
              <option value="restaurant">🍽️ რესტ.</option>
              <option value="other">👤 სხვა</option>
            </select>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">გადახდის დრო</label>
            <select value={form.timing} onChange={e => setForm(f => ({...f, timing: e.target.value}))}
              className="border rounded px-3 py-2 text-sm w-full">
              <option value="before">შეს./ჭამ.-მდე</option>
              <option value="after">მომს. შემდეგ</option>
            </select>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">რამდენი დღით</label>
            <div className="flex items-center gap-2">
              <input type="number" value={form.days_offset} min="0" max="90"
                onChange={e => setForm(f => ({...f, days_offset: e.target.value}))}
                className="border rounded px-3 py-2 text-sm w-20"/>
              <span className="text-sm text-gray-500">დღე</span>
            </div>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">ფასი (ერთ. / ბინა)</label>
            <div className="flex gap-1">
              <input type="number" value={form.unit_price} min="0" step="0.01"
                onChange={e => setForm(f => ({...f, unit_price: e.target.value}))}
                className="border rounded px-2 py-2 text-sm w-24"/>
              <select value={form.currency} onChange={e => setForm(f => ({...f, currency: e.target.value}))}
                className="border rounded px-2 py-2 text-sm">
                <option value="GEL">₾</option>
                <option value="USD">$</option>
              </select>
            </div>
          </div>
        </div>
        <div className="flex gap-3">
          <input value={form.notes} onChange={e => setForm(f => ({...f, notes: e.target.value}))}
            placeholder="შენიShvna (სურვ.)..."
            className="border rounded px-3 py-2 text-sm flex-1"/>
          <button onClick={save} disabled={saving || !form.vendor_name.trim()}
            className="px-5 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 disabled:opacity-50 font-medium">
            {saving ? '...' : editId ? 'განახლება' : 'დამატება'}
          </button>
          {editId && <button onClick={() => { setForm(EMPTY); setEditId(null); }}
            className="px-4 py-2 bg-gray-200 rounded text-sm hover:bg-gray-300">გაუქმება</button>}
        </div>
      </div>

      <div className="bg-white rounded-lg shadow overflow-hidden">
        <div className="px-4 py-3 border-b bg-gray-50 flex items-center justify-between">
          <span className="font-semibold text-sm">გადახდის პირობები ({terms.length})</span>
          <span className="text-xs text-gray-500">სასტ./რესტ. სახელი უნდა ემთხვეოდეს DB-ში</span>
        </div>
        {loading ? <Spinner/> : terms.length === 0 ? (
          <div className="text-center py-10 text-gray-400 text-sm">პირობები არ არის. დაამატე ზემოთ.</div>
        ) : (
          <table className="w-full text-sm">
            <thead className="border-b bg-gray-50">
              <tr>
                {['ვენდორი','ტიპი','გადახდა','დღე','ფასი','შენ.',''].map(h => (
                  <th key={h} className="text-left px-4 py-2 text-xs font-semibold text-gray-500">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {terms.map(t => (
                <tr key={t.id} className={`border-b hover:bg-gray-50 ${editId===t.id ? 'bg-blue-50' : ''}`}>
                  <td className="px-4 py-2.5 font-medium">{t.vendor_name}</td>
                  <td className="px-4 py-2.5">
                    <span className={`px-2 py-0.5 rounded text-xs ${t.vendor_type==='hotel'?'bg-blue-100 text-blue-700':t.vendor_type==='other'?'bg-purple-100 text-purple-700':'bg-orange-100 text-orange-700'}`}>
                      {t.vendor_type==='hotel'?'🏨 სასტ.':t.vendor_type==='other'?'👤 სხვა':'🍽️ რესტ.'}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 text-gray-600 text-xs">
                    <span className={`px-2 py-0.5 rounded ${t.timing==='before'?'bg-purple-100 text-purple-700':'bg-green-100 text-green-700'}`}>
                      {t.timing==='before'?'შეს.-მდე':'შემდეგ'}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 font-bold text-gray-700">{t.days_offset} დღ.</td>
                  <td className="px-4 py-2.5 text-sm font-semibold text-emerald-700">
                    {t.unit_price > 0
                      ? (t.vendor_type==='hotel'
                          ? `${t.currency==='USD'?'$':'₾'}${(t.unit_price*10).toFixed(0)}`
                          : `${t.currency==='USD'?'$':'₾'}${t.unit_price}`)
                      : '—'}
                  </td>
                  <td className="px-4 py-2.5 text-gray-400 text-xs max-w-xs truncate">{t.notes||'—'}</td>
                  <td className="px-4 py-2.5 flex gap-2">
                    <button onClick={() => startEdit(t)} className="text-blue-400 hover:text-blue-600 text-xs">✏️</button>
                    <button onClick={() => del(t.id)} className="text-red-400 hover:text-red-600 text-xs">✕</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <div className="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-4 text-xs text-amber-700">
        <strong>მნიშვნელოვანი:</strong> ვენდორის სახელი <strong>ზუსტად</strong> უნდა ემთხვეოდეს daily_log-ში შენახულ სახელს.
        მაგ: <code>Pullman Tbilisi</code>, <code>ხAReba</code>, <code>Marco Polo Gudauri</code>.
        Autocomplete-ში ჩანს DB-ში დაფიქსირებული სახელები.
      </div>
    </div>
  );
}

        </div>
        <div className="border-t border-slate-700">
          <div className="max-w-screen-xl mx-auto px-4 flex">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-5 py-3 text-sm font-medium transition-colors ${
                  tab === t.id ? "border-b-2 border-amber-400 text-white" : "text-slate-400 hover:text-white"
                }`}>{t.label}</button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-screen-xl mx-auto">
        {tab === "timeline"   && <TimelineView onSelectTour={handleSelectTour}/>}
        {tab === "day"        && <DayView onSelectTour={handleSelectTour}/>}
        {tab === "detail"     && <TourDetailView initialCode={selectedTour} onBack={() => setTab("day")}/>}
        {tab === "accounting" && <AccountingView onSelectTour={handleSelectTour}/>}
        {tab === "payments"   && <PaymentsView/>}
        {tab === "settings"   && <SettingsView/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
