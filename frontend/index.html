<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ki.360</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.27.3/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
* { font-family: 'Noto Sans Georgian', sans-serif; }
.gantt-scroll { overflow-x: auto; }
.bar { border-radius: 4px; height: 22px; cursor: pointer; display: flex; align-items: center;
       padding: 0 6px; font-size: 11px; color: white; font-weight: 600;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.15s; }
.bar:hover { opacity: 0.8; }
.spinner { border: 3px solid #e5e7eb; border-top: 3px solid #3b82f6; border-radius: 50%;
           width: 32px; height: 32px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = window.location.origin + "/api";

const SERIES_COLORS = {
  ZT: "#42A5F5", LN: "#66BB6A", KT: "#FF7043", DT1: "#AB47BC", DT2: "#EC407A"
};

// Approx tour price (USD) for a 19+1 group — revenue from clients.
const TOUR_PRICE = { ZT: 20300, LN: 17350, KT: 13600, DT1: 13300, DT2: 13300 };

const pad2 = n => String(n).padStart(2, "0");
const addDays = (iso, n) => {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  return toISO(dt);
};
const toISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;

function Badge({ series }) {
  return (
    <span className="px-2 py-0.5 rounded text-white text-xs font-bold"
      style={{ background: SERIES_COLORS[series] || "#888" }}>{series}</span>
  );
}

function Spinner() {
  return <div className="flex justify-center p-10"><div className="spinner"/></div>;
}

// ── TIMELINE VIEW ──────────────────────────────────────────────
function TimelineView({ onSelectTour }) {
  const [tours, setTours] = useState([]);
  const [loading, setLoading] = useState(true);
  const [viewDate, setViewDate] = useState(new Date());
  const [filters, setFilters] = useState({ZT:true,LN:true,KT:true,DT1:true,DT2:true});
  const [popup, setPopup] = useState(null);
  const scrollRef = useRef(null);
  const today = new Date();

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month, daysInMonth);

  const MONTH_NAMES = ["იანვარი","თებერვალი","მარტი","აპრილი","მაისი","ივნისი",
    "ივლისი","აგვისტო","სექტემბერი","ოქტომბერი","ნოემბერი","დეკემბერი"];

  useEffect(() => {
    setLoading(true);
    fetch(`${API}/timeline?from_date=${toISO(monthStart)}&to_date=${toISO(monthEnd)}`)
      .then(r => r.json()).then(d => { setTours(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, [year, month]);

  const filtered = tours.filter(t => filters[t.series]);

  const DAY_W = 34, ROW_H = 30, LABEL_W = 130;

  const barProps = (tour) => {
    const bs = new Date(tour.bus_start + "T00:00:00");
    const be = new Date(tour.bus_end + "T00:00:00");
    const s = Math.max(0, Math.round((bs - monthStart) / 86400000));
    const e = Math.min(daysInMonth, Math.round((be - monthStart) / 86400000));
    if (e <= 0 || s >= daysInMonth) return null;
    return { left: s * DAY_W, width: Math.max((e - s) * DAY_W - 2, 10) };
  };

  const handleBarClick = async (tour, e) => {
    e.stopPropagation();
    const checkDate = toISO(today);
    try {
      const data = await fetch(`${API}/tours/${checkDate}`).then(r => r.json());
      const info = data.find(d => d.code === tour.code);
      setPopup({ tour, info, x: Math.min(e.clientX, window.innerWidth-280), y: Math.min(e.clientY+12, window.innerHeight-220) });
    } catch { setPopup({ tour, info: null, x: e.clientX, y: e.clientY+12 }); }
  };

  const scrollToToday = () => {
    if (today.getFullYear() === year && today.getMonth() === month) {
      if (scrollRef.current) scrollRef.current.scrollLeft = (today.getDate()-1) * DAY_W - 200;
    } else { setViewDate(new Date()); }
  };

  return (
    <div className="p-4" onClick={() => setPopup(null)}>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <button onClick={() => setViewDate(new Date(year, month-1, 1))}
          className="px-3 py-1.5 bg-white border rounded hover:bg-gray-50 text-sm">◀</button>
        <span className="font-semibold text-lg min-w-48 text-center">{MONTH_NAMES[month]} {year}</span>
        <button onClick={() => setViewDate(new Date(year, month+1, 1))}
          className="px-3 py-1.5 bg-white border rounded hover:bg-gray-50 text-sm">▶</button>
        <button onClick={scrollToToday}
          className="px-3 py-1.5 bg-amber-400 text-white rounded text-sm font-medium hover:bg-amber-500">📅 დღეს</button>
        <div className="flex gap-2 flex-wrap">
          {Object.keys(SERIES_COLORS).map(s => (
            <label key={s} className="flex items-center gap-1 cursor-pointer text-sm select-none">
              <input type="checkbox" checked={filters[s]}
                onChange={e => setFilters(f => ({...f, [s]: e.target.checked}))} className="rounded"/>
              <span className="px-2 py-0.5 rounded text-white text-xs font-bold"
                style={{background: SERIES_COLORS[s]}}>{s}</span>
            </label>
          ))}
        </div>
      </div>

      {loading ? <Spinner/> : (
        <div className="bg-white rounded-lg shadow overflow-hidden">
          <div ref={scrollRef} className="gantt-scroll">
            <div style={{ minWidth: LABEL_W + daysInMonth * DAY_W }}>
              <div className="flex border-b bg-gray-50 sticky top-0 z-10">
                <div style={{width:LABEL_W,minWidth:LABEL_W}}
                  className="text-xs font-semibold text-gray-500 p-2 border-r shrink-0">ტური</div>
                {Array.from({length: daysInMonth}, (_, i) => {
                  const isTd = today.getFullYear()===year && today.getMonth()===month && today.getDate()===i+1;
                  return (
                    <div key={i} style={{width:DAY_W,minWidth:DAY_W}}
                      className={`text-center text-xs py-2 border-r shrink-0 ${isTd?"bg-amber-100 font-bold text-amber-700":"text-gray-400"}`}>
                      {i+1}
                    </div>
                  );
                })}
              </div>
              {filtered.length === 0 ? (
                <div className="p-10 text-center text-gray-400">ამ თვეში ტურები არ არის</div>
              ) : filtered.map(tour => {
                const bp = barProps(tour);
                return (
                  <div key={tour.code} className="flex border-b hover:bg-gray-50" style={{height:ROW_H}}>
                    <div style={{width:LABEL_W,minWidth:LABEL_W}}
                      className="text-xs font-medium px-2 flex items-center border-r cursor-pointer hover:text-blue-600 truncate shrink-0"
                      onClick={() => onSelectTour(tour.code)}>{tour.code}</div>
                    <div className="relative flex-1">
                      {today.getFullYear()===year && today.getMonth()===month && (
                        <div className="absolute inset-y-0 bg-amber-50"
                          style={{left:(today.getDate()-1)*DAY_W, width:DAY_W}}/>
                      )}
                      {bp && (
                        <div className="bar absolute top-1"
                          style={{left:bp.left, width:bp.width, background:tour.color}}
                          onClick={e => handleBarClick(tour, e)}>{tour.code}</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {popup && (
        <div className="fixed z-50 bg-white border shadow-2xl rounded-xl p-4 text-sm w-64"
          style={{left:popup.x, top:popup.y}} onClick={e => e.stopPropagation()}>
          <div className="flex items-center gap-2 mb-2">
            <Badge series={popup.tour.series}/>
            <span className="font-bold">{popup.tour.code}</span>
            <button className="ml-auto text-gray-400 hover:text-gray-700" onClick={() => setPopup(null)}>✕</button>
          </div>
          <div className="text-xs text-gray-400 mb-3">{popup.tour.bus_start} → {popup.tour.bus_end}</div>
          {popup.info ? (
            <div className="space-y-1 text-xs">
              <div>📍 <strong>{popup.info.city}</strong></div>
              <div>🏨 {popup.info.hotel}</div>
              <div>🍽️ {popup.info.lunch}</div>
              <div>🌙 {popup.info.dinner}</div>
              {popup.info.border_crossing && <div className="text-orange-600">🚧 {popup.info.border_crossing}</div>}
            </div>
          ) : <div className="text-xs text-gray-400">დღეს არ არის აქტიური</div>}
          <button className="mt-3 text-blue-600 text-xs hover:underline"
            onClick={() => { setPopup(null); onSelectTour(popup.tour.code); }}>სრული itinerary →</button>
        </div>
      )}
    </div>
  );
}

// ── DAY VIEW ───────────────────────────────────────────────────
function DayView({ onSelectTour }) {
  const [selDate, setSelDate] = useState(toISO(new Date()));
  const [tours, setTours] = useState([]);
  const [borders, setBorders] = useState([]);
  const [loading, setLoading] = useState(false);

  const load = useCallback(d => {
    setLoading(true);
    Promise.all([
      fetch(`${API}/tours/${d}`).then(r => r.json()),
      fetch(`${API}/border/${d}`).then(r => r.json()),
    ]).then(([t, b]) => { setTours(t); setBorders(b); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  useEffect(() => { load(selDate); }, [selDate]);

  const changeDay = delta => {
    const d = new Date(selDate + "T00:00:00");
    d.setDate(d.getDate() + delta);
    setSelDate(toISO(d));
  };

  const grouped = {};
  for (const t of tours) {
    const c = t.city || "სხვა";
    if (!grouped[c]) grouped[c] = [];
    grouped[c].push(t);
  }

  const displayDate = new Date(selDate + "T00:00:00").toLocaleDateString("ka-GE", {
    weekday:"long", year:"numeric", month:"long", day:"numeric"
  });

  return (
    <div className="p-4 max-w-2xl mx-auto">
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <button onClick={() => changeDay(-1)} className="px-3 py-2 bg-white border rounded hover:bg-gray-50">◀</button>
        <input type="date" value={selDate} onChange={e => setSelDate(e.target.value)}
          className="border rounded px-3 py-2 text-sm"/>
        <button onClick={() => changeDay(1)} className="px-3 py-2 bg-white border rounded hover:bg-gray-50">▶</button>
        <button onClick={() => setSelDate(toISO(new Date()))}
          className="px-3 py-2 bg-amber-400 text-white rounded text-sm font-medium hover:bg-amber-500">📅 დღეს</button>
        <span className="text-gray-500 text-sm">{displayDate}</span>
      </div>

      {loading ? <Spinner/> : tours.length === 0 ? (
        <div className="bg-white rounded-xl shadow p-10 text-center text-gray-400">
          <div className="text-4xl mb-2">📭</div>
          <div className="text-sm">ამ დღეს ტურები არ არის</div>
        </div>
      ) : (
        <>
          {Object.entries(grouped).map(([city, cts]) => (
            <div key={city} className="mb-3 flex gap-3 items-start">
              <div className="w-28 flex-shrink-0 pt-2 text-right">
                <div className="text-sm font-semibold text-gray-700">📍 {city}</div>
                <div className="text-xs text-gray-400">{cts.length} ჯგ.</div>
              </div>
              <div className="flex-1 grid gap-1.5">
                {cts.map(t => (
                  <div key={t.code} className="bg-white rounded-lg shadow-sm border-l-4 px-3 py-2"
                    style={{borderLeftColor: t.color}}>
                    <div className="flex items-start gap-3">
                      <div className="flex flex-col gap-1 items-start flex-shrink-0 pt-0.5">
                        <Badge series={t.series}/>
                        <button className="font-bold text-gray-700 hover:text-blue-600 text-sm"
                          onClick={() => onSelectTour(t.code)}>{t.code}</button>
                      </div>
                      <div className="flex-1 text-sm text-gray-700 space-y-0.5">
                        <div>🏨 {t.hotel && t.hotel.startsWith('? ')
                          ? <span className="text-orange-500 font-semibold">{t.hotel} ⚠</span>
                          : t.hotel}</div>
                        <div>🍽️ <span className="text-gray-400">L:</span> <span className={t.lunch && t.lunch.includes('საკუთარი') ? 'text-red-500 font-medium' : ''}>{t.lunch}</span></div>
                        <div>🌙 <span className="text-gray-400">V:</span> <span className={t.dinner && t.dinner.includes('საკუთარი') ? 'text-red-500 font-medium' : ''}>{t.dinner}</span></div>
                        {t.border_crossing && (
                          <div className="text-orange-600 font-medium">🚧 {t.border_crossing}</div>
                        )}
                      </div>
                      <span className="text-sm text-gray-400 flex-shrink-0">Day {t.day_num}/{t.total_days}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {borders.length > 0 && (
            <div className="mt-4 bg-orange-50 border border-orange-200 rounded-xl p-4">
              <h3 className="font-bold text-orange-700 mb-2 text-sm">🚧 დღის საზ.კვ.</h3>
              {borders.map((b, i) => (
                <div key={i} className="text-sm text-orange-800 mb-1">
                  • <strong>{b.tour_code}</strong>: {b.border_crossing}
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── TOUR DETAIL VIEW ───────────────────────────────────────────
function TourDetailView({ initialCode, onBack }) {
  const [search, setSearch] = useState(initialCode || "");
  const [tour, setTour] = useState(null);
  const [loading, setLoading] = useState(false);
  const [editNotes, setEditNotes] = useState({});
  const [saving, setSaving] = useState({});

  const loadTour = code => {
    if (!code) return;
    setLoading(true);
    fetch(`${API}/tour/${code.toUpperCase()}`)
      .then(r => r.ok ? r.json() : null)
      .then(d => { setTour(d); setLoading(false); })
      .catch(() => setLoading(false));
  };

  useEffect(() => { if (initialCode) loadTour(initialCode); }, [initialCode]);

  const saveNote = async (logId, notes) => {
    setSaving(s => ({...s, [logId]: true}));
    await fetch(`${API}/log/${logId}/note`, {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({notes})
    });
    setSaving(s => ({...s, [logId]: false}));
    setEditNotes(n => { const x={...n}; delete x[logId]; return x; });
    loadTour(tour.code);
  };

  const STATUS = {active:"bg-green-100 text-green-700", upcoming:"bg-blue-100 text-blue-700", done:"bg-gray-100 text-gray-500"};
  const STATUS_GEO = {active:"აქტიური", upcoming:"მომავალი", done:"დასრულებული"};

  return (
    <div className="p-4 max-w-5xl mx-auto">
      <div className="flex items-center gap-3 mb-6 flex-wrap">
        <button onClick={onBack} className="px-3 py-2 bg-white border rounded hover:bg-gray-50 text-sm">← უკან</button>
        <form onSubmit={e => { e.preventDefault(); loadTour(search); }} className="flex gap-2">
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="კოდი: ZT-0601 ..."
            className="border rounded px-3 py-2 text-sm w-44"/>
          <button type="submit"
            className="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">ძებნა</button>
        </form>
      </div>

      {loading ? <Spinner/> : !tour ? (
        <div className="bg-white rounded-xl shadow p-14 text-center text-gray-400">
          <div className="text-5xl mb-3">🔍</div>
          <div>ჩაწერე ტურის კოდი ძებნის ველში</div>
        </div>
      ) : (
        <>
          <div className="bg-white rounded-xl shadow p-5 mb-5">
            <div className="flex items-center gap-3 flex-wrap">
              <Badge series={tour.series}/>
              <h2 className="text-xl font-bold">{tour.code}</h2>
              <span className={`px-2 py-0.5 rounded text-xs font-medium ${STATUS[tour.status]}`}>
                {STATUS_GEO[tour.status]}
              </span>
            </div>
            <div className="text-sm text-gray-500 mt-1">{tour.series_name}</div>
            <div className="text-sm text-gray-600 mt-1">📅 {tour.bus_start} → {tour.bus_end}</div>
          </div>

          <div className="bg-white rounded-xl shadow overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 border-b">
                <tr>{["დღე","თარიღი","ქალაქი","სასტუმრო","სადილი","ვახშამი","საზ.კვ.","შენიშვნა"].map(h => (
                  <th key={h} className="text-left px-3 py-2 text-xs font-semibold text-gray-500 whitespace-nowrap">{h}</th>
                ))}</tr>
              </thead>
              <tbody>
                {tour.days.map(day => (
                  <tr key={day.log_id} className="border-b hover:bg-gray-50">
                    <td className="px-3 py-2 font-bold text-gray-400 text-center">{day.day_num}</td>
                    <td className="px-3 py-2 whitespace-nowrap text-gray-500 text-xs">{day.date}</td>
                    <td className="px-3 py-2 font-medium text-sm">{day.city}</td>
                    <td className="px-3 py-2 text-xs max-w-xs">
                      {day.hotel && day.hotel.startsWith('? ')
                        ? <span className="text-orange-500 font-semibold">{day.hotel} ⚠</span>
                        : <span className="text-gray-600">{day.hotel}</span>}
                    </td>
                    <td className="px-3 py-2 text-gray-600 text-xs">{day.lunch}</td>
                    <td className="px-3 py-2 text-gray-600 text-xs">{day.dinner}</td>
                    <td className="px-3 py-2 text-orange-600 text-xs whitespace-nowrap">{day.border_crossing}</td>
                    <td className="px-3 py-2">
                      {editNotes[day.log_id] !== undefined ? (
                        <div className="flex gap-1">
                          <textarea value={editNotes[day.log_id]}
                            onChange={e => setEditNotes(n => ({...n, [day.log_id]: e.target.value}))}
                            className="border rounded px-2 py-1 text-xs w-28 h-10 resize-none"/>
                          <button onClick={() => saveNote(day.log_id, editNotes[day.log_id])}
                            disabled={saving[day.log_id]}
                            className="px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600 disabled:opacity-50">
                            {saving[day.log_id] ? "…" : "✓"}
                          </button>
                          <button onClick={() => setEditNotes(n => { const x={...n}; delete x[day.log_id]; return x; })}
                            className="px-2 py-1 bg-gray-200 rounded text-xs">✕</button>
                        </div>
                      ) : (
                        <div className="flex items-center gap-1">
                          <span className="text-xs text-gray-400 truncate max-w-20">{day.notes}</span>
                          <button onClick={() => setEditNotes(n => ({...n, [day.log_id]: day.notes || ""}))}
                            className="text-blue-400 hover:text-blue-600 text-xs shrink-0">✏️</button>
                        </div>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

// ── ACCOUNTING VIEW ────────────────────────────────────────────
function AccountingView({ onSelectTour }) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all'); // all, due, active, done
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('bus_start');

  useEffect(() => {
    fetch(`${API}/financials`)
      .then(r => r.json())
      .then(d => { setData(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const filtered = data
    .filter(t => {
      if (filter === 'due') return t.due_gel > 0;
      if (filter === 'active') return t.status === 'active';
      if (filter === 'done') return t.status === 'done';
      return true;
    })
    .filter(t => !search || t.tour_code.toLowerCase().includes(search.toLowerCase()) || (t.guide||'').toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => {
      if (sortBy === 'due_gel') return b.due_gel - a.due_gel;
      if (sortBy === 'profit') return b.profit_gel - a.profit_gel;
      return a.bus_start.localeCompare(b.bus_start);
    });

  const totalDue = data.reduce((s,t) => s + (t.due_gel||0), 0);
  const totalPaid = data.reduce((s,t) => s + (t.paid_gel||0), 0);
  const totalProfit = data.reduce((s,t) => s + (t.profit_gel||0), 0);
  const totalSpent = data.reduce((s,t) => s + (t.spent_gel||0), 0);
  const dueCount = data.filter(t => t.due_gel > 0).length;

  const fmt = (n) => n ? Math.round(n).toLocaleString() + ' ₾' : '—';
  const fmtU = (n) => n ? Math.round(n).toLocaleString() + ' $' : '—';

  return (
    <div className="p-4 max-w-screen-xl mx-auto">
      {/* Summary Cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div className="bg-red-50 border border-red-200 rounded-lg p-4">
          <div className="text-xs text-red-500 font-medium mb-1">გადასახდელი</div>
          <div className="text-2xl font-bold text-red-700">{fmt(totalDue)}</div>
          <div className="text-xs text-red-400 mt-1">{dueCount} ტური</div>
        </div>

// ── PAYMENTS VIEW ─────────────────────────────────────────────
function PaymentsView() {
  const [schedule, setSchedule] = useState([]);
  const [tourSummary, setTourSummary] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('due_soon');
  const [groupBy, setGroupBy] = useState('date');
  const [syncing, setSyncing] = useState(false);

  const load = () => {
    setLoading(true);
    Promise.all([
      fetch(`${API}/payments/schedule`).then(r => r.json()),
      fetch(`${API}/payments/tour-summary`).then(r => r.json()),
    ]).then(([s, t]) => { setSchedule(s); setTourSummary(t); setLoading(false); })
      .catch(() => setLoading(false));
  };

  const syncAndReload = () => {
    setSyncing(true);
    fetch(`${API}/sync-payment-status`, {method:'POST'})
      .then(() => load())
      .catch(() => load())
      .finally(() => setSyncing(false));
  };

  useEffect(() => { load(); }, []);

  const filtered = schedule.filter(p =>
    filter === 'all' ? true :
    filter === 'overdue' ? p.status === 'overdue' :
    filter === 'due_soon' ? (p.days_until_due >= 0 && p.days_until_due <= 3) :
    filter === 'due_5' ? (p.days_until_due >= 0 && p.days_until_due <= 5) :
    filter === 'due_10' ? (p.days_until_due >= 0 && p.days_until_due <= 10) :
    p.status === 'upcoming'
  );

  const grouped = filtered.reduce((acc, item) => {
    if (!acc[item.due_date]) acc[item.due_date] = [];
    acc[item.due_date].push(item);
    return acc;
  }, {});

  const overdueCnt = schedule.filter(p => p.status === 'overdue').length;
  const soonCnt = schedule.filter(p => p.status === 'due_soon').length;
  const upcomingCnt = schedule.filter(p => p.status === 'upcoming').length;

  const vendorIcon = t => t === 'hotel' ? '🏨' : t === 'other' ? '👤' : '🍽️';
  const isSakutari = name => name && name.includes('საკუთარი');

  const sortedDates = Object.keys(grouped).sort((a, b) =>
    filter === 'overdue' ? b.localeCompare(a) : a.localeCompare(b)
  );

  const activeTours = tourSummary.filter(t => t.status !== 'done');

  return (
    <div className="p-4 max-w-5xl mx-auto">
      <div className="grid grid-cols-3 gap-3 mb-4">
        <div className="bg-red-50 border border-red-200 rounded-lg px-3 py-2.5 cursor-pointer" onClick={() => { setGroupBy('date'); setFilter('overdue'); }}>
          <div className="text-xs text-red-500 mb-0.5">ვადაგადასული</div>
          <div className="text-2xl font-bold text-red-700">{overdueCnt}</div>
        </div>
        <div className="bg-orange-50 border border-orange-200 rounded-lg px-3 py-2.5 cursor-pointer" onClick={() => { setGroupBy('date'); setFilter('due_soon'); }}>
          <div className="text-xs text-orange-500 mb-0.5">3 დღეში</div>
          <div className="text-2xl font-bold text-orange-600">{soonCnt}</div>
        </div>
        <div className="bg-blue-50 border border-blue-200 rounded-lg px-3 py-2.5 cursor-pointer" onClick={() => { setGroupBy('date'); setFilter('upcoming'); }}>
          <div className="text-xs text-blue-500 mb-0.5">მომდევნო</div>
          <div className="text-2xl font-bold text-blue-700">{upcomingCnt}</div>
        </div>
      </div>

      <div className="flex gap-2 mb-3 flex-wrap items-center">
        {groupBy === 'date' && [['all','ყველა'],['overdue','ვადაგადასული'],['due_soon','3 დღე ჯამურად'],['due_5','5 დღე ჯამურად'],['due_10','10 დღე ჯამურად'],['upcoming','მომდევნო']].map(([v,l]) => (
          <button key={v} onClick={() => setFilter(v)}
            className={`px-3 py-1 rounded text-xs ${filter===v ? 'bg-slate-700 text-white' : 'bg-white border hover:bg-gray-50'}`}>{l}</button>
        ))}
        <button onClick={() => setGroupBy('date')}
          className={`ml-auto px-3 py-1 rounded text-xs ${groupBy==='date' ? 'bg-slate-700 text-white' : 'bg-white border hover:bg-gray-50'}`}>📅 თარიღით</button>
        <button onClick={() => setGroupBy('tour')}
          className={`px-3 py-1 rounded text-xs ${groupBy==='tour' ? 'bg-slate-700 text-white' : 'bg-white border hover:bg-gray-50'}`}>🗂 ტურებით</button>
        <button onClick={syncAndReload} disabled={syncing}
          className="px-3 py-1 rounded text-xs bg-white border hover:bg-gray-50 disabled:opacity-50">{syncing ? '...' : '↻'}</button>
      </div>

      {loading ? <Spinner/> : groupBy === 'tour' ? (
        <div className="space-y-4">
          {activeTours.length === 0 ? (
            <div className="text-center py-16 text-gray-400 text-sm">მიმდინარე ტURები არ არის</div>
          ) : activeTours.map(tour => (
            <div key={tour.tour_code} className="bg-white rounded-lg shadow-sm overflow-hidden">
              <div className="px-3 py-2 bg-slate-800 text-white flex items-center gap-2">
                <Badge series={tour.series}/>
                <span className="font-bold text-sm">{tour.tour_code}</span>
                <span className="text-xs text-slate-400">{tour.bus_start} → {tour.bus_end}</span>
                {tour.total_usd > 0 && <span className="ml-auto text-xs font-bold text-blue-300">${tour.total_usd.toFixed(0)}</span>}
                {tour.total_gel > 0 && <span className={`text-xs font-bold text-emerald-300 ${tour.total_usd > 0 ? '' : 'ml-auto'}`}>₾{tour.total_gel.toFixed(0)}</span>}
              </div>
              <div className="divide-y">
                {(tour.services || []).map((svc, i) => (
                  <div key={i} className={`px-3 py-2 flex items-center gap-2 ${isSakutari(svc.vendor_name) ? 'bg-red-50' : ''}`}>
                    <span className="text-sm flex-shrink-0">{vendorIcon(svc.vendor_type)}</span>
                    <span className={`text-sm flex-1 min-w-0 truncate ${isSakutari(svc.vendor_name) ? 'text-red-600 font-medium' : ''}`}>{svc.vendor_name}</span>
                    {svc.paid && <span className="text-xs font-bold px-1.5 py-0.5 rounded bg-green-100 text-green-700 flex-shrink-0">OK</span>}
                    {svc.total_amount > 0 && (
                      <span className={`text-xs font-bold flex-shrink-0 ${svc.currency==='USD' ? 'text-blue-600' : 'text-emerald-600'}`}>
                        {svc.currency==='USD' ? '$' : '₾'}{svc.total_amount.toFixed(0)}
                      </span>
                    )}
                    <span className="text-xs text-gray-400 flex-shrink-0">{svc.due_date}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      ) : filtered.length === 0 ? (
        <div className="text-center py-16 text-gray-400">
          <div className="text-4xl mb-2">✓</div>
          <div className="text-sm">{schedule.length === 0 ? 'გადახდის პირობები არ არის დაყენებული' : 'გადასახდელი არ არის'}</div>
        </div>
      ) : (
        <div className="flex gap-4 items-start">
          <div className="flex-1 space-y-2">
            {sortedDates.map(dueDate => {
              const items = grouped[dueDate];
              const diff = items[0].days_until_due;
              const borderCls = diff < 0 ? 'border-red-500' : diff <= 3 ? 'border-orange-400' : 'border-blue-400';
              const headCls = diff < 0 ? 'bg-red-50 text-red-700' : diff <= 3 ? 'bg-orange-50 text-orange-700' : 'bg-blue-50 text-blue-700';
              const diffLabel = diff < 0 ? `${Math.abs(diff)} დღე ვადაგადასული!` : diff === 0 ? 'დღეს!' : `${diff} დღეში`;
              return (
                <div key={dueDate} className={`bg-white rounded-lg shadow-sm overflow-hidden border-l-4 ${borderCls}`}>
                  <div className={`px-3 py-1.5 flex items-center gap-2 text-xs ${headCls}`}>
                    <span className="font-bold">{dueDate}</span>
                    <span className="font-medium">{diffLabel}</span>
                    <span className="ml-auto opacity-60">{items.length} ჩ.</span>
                  </div>
                  <div className="divide-y">
                    {items.map((item, idx) => (
                      <div key={idx} className={`px-3 py-2 flex items-center gap-2 ${isSakutari(item.vendor_name) ? 'bg-red-50' : ''}`}>
                        <Badge series={item.series}/>
                        <span className="text-xs font-bold text-gray-700 w-16 flex-shrink-0">{item.tour_code}</span>
                        <span className="text-sm flex-shrink-0">{vendorIcon(item.vendor_type)}</span>
                        <span className={`text-sm font-medium flex-1 min-w-0 truncate ${isSakutari(item.vendor_name) ? 'text-red-600' : ''}`}>{item.vendor_name}</span>
                        {item.paid && <span className="text-xs font-bold px-1.5 py-0.5 rounded bg-green-100 text-green-700 flex-shrink-0">OK</span>}
                        {item.total_amount > 0 && (

              <div className="divide-y">
                {sortedDates.map(dueDate => {
                  const items = grouped[dueDate];
                  const usd = items.filter(i=>i.currency==='USD'&&i.total_amount>0).reduce((s,i)=>s+i.total_amount,0);
                  const gel = items.filter(i=>i.currency==='GEL'&&i.total_amount>0).reduce((s,i)=>s+i.total_amount,0);
                  if (!usd && !gel) return null;

                  const dateCls = diff < 0 ? 'text-red-600' : diff <= 3 ? 'text-orange-600' : 'text-gray-600';

// Bar chart with a FIXED (non-scrolling) Y axis on the left and a
// horizontally scrollable plot area on the right.
function ScrollBarChart({ labels, datasets, height = 320, colWidth = 46,
                          yTitle = 'USD ($)', highlightLabel = null,
                          centerLabel = null, tooltipLabel = null }) {
  const axisRef = useRef(null), mainRef = useRef(null);
  const axisChart = useRef(null), mainChart = useRef(null);
  const scrollRef = useRef(null);

  const dataKey = JSON.stringify([labels, datasets.map(d => d.data)]);

  useEffect(() => {
    if (!window.Chart || !mainRef.current || !axisRef.current) return;
    const allVals = datasets.flatMap(d => d.data);
    const maxVal = Math.max(0, ...allVals);
    const fixedMax = Math.max(1, Math.ceil(maxVal / 1000) * 1000);

    if (axisChart.current) axisChart.current.destroy();
    if (mainChart.current) mainChart.current.destroy();

    const xCommon = { maxRotation: 90, minRotation: 60, autoSkip: false, font: { size: 10 } };

    // Left: axis only (bars invisible, x labels invisible but laid out for alignment)
    axisChart.current = new Chart(axisRef.current, {
      type: 'bar',
      data: { labels, datasets: datasets.map(d => ({ ...d, backgroundColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)' })) },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { ticks: { ...xCommon, color: 'rgba(0,0,0,0)' }, grid: { display: false } },
          y: { beginAtZero: true, max: fixedMax, title: { display: true, text: yTitle, font: { size: 11 } }, ticks: { font: { size: 11 } } },
        },
      },
    });

    // Right: real bars, y ticks hidden (the fixed axis provides them)
    mainChart.current = new Chart(mainRef.current, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: tooltipLabel ? { callbacks: { label: tooltipLabel } } : {},
        },
        scales: {
          x: { ticks: { ...xCommon, color: (ctx) => (labels[ctx.index] === highlightLabel ? '#dc2626' : '#6b7280') }, grid: { display: false } },
          y: { beginAtZero: true, max: fixedMax, ticks: { display: false }, grid: { display: true } },
        },
      },
    });

    if (scrollRef.current && centerLabel) {
      let idx = labels.findIndex(d => d >= centerLabel);
      if (idx < 0) idx = labels.length - 1;
      const sc = scrollRef.current;
      const colW = sc.scrollWidth / Math.max(labels.length, 1);
      sc.scrollLeft = Math.max(0, (idx + 0.5) * colW - sc.clientWidth / 2);
    }

    return () => {
      if (axisChart.current) axisChart.current.destroy();
      if (mainChart.current) mainChart.current.destroy();
    };
  }, [dataKey, height, colWidth]);

  const chartWidth = Math.max(720, labels.length * colWidth);
  return (
    <div className="flex">
      <div style={{ width: 64, height }} className="flex-shrink-0"><canvas ref={axisRef}/></div>
      <div className="overflow-x-auto flex-1" ref={scrollRef}>
        <div style={{ width: chartWidth, height }}><canvas ref={mainRef}/></div>
      </div>
    </div>
  );
}

// ── BUS PAYMENTS VIEW ─────────────────────────────────────────
function BusView() {
  const [tours, setTours] = useState([]);
  const [offset, setOffset] = useState(10);
  const [editOffset, setEditOffset] = useState('10');
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('upcoming');

  useEffect(() => {
    Promise.all([
      fetch(`${API}/tours`).then(r => r.json()),
      fetch(`${API}/settings/bus_offset`).then(r => r.json()).catch(() => ({value: '10'})),
    ]).then(([ts, s]) => {
      setTours(ts);
      const n = parseInt(s.value) || 10;
      setOffset(n);
      setEditOffset(String(n));
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  const saveOffset = () => {
    const n = parseInt(editOffset);
    if (isNaN(n) || n < 0) return;
    setOffset(n);
    fetch(`${API}/settings/bus_offset`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({value: String(n)}),
    });
  };

  const today = toISO(new Date());

  const rows = tours.map(t => {
    const dueDate = addDays(t.bus_end, offset);
    const diff = Math.round((new Date(dueDate + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
    const status = diff < 0 ? 'overdue' : diff <= 3 ? 'due_soon' : 'upcoming';
    return { ...t, dueDate, diff, status };
  });

  const filtered = rows.filter(r => {
    if (filter === 'overdue')  return r.status === 'overdue';
    if (filter === 'due_soon') return r.status === 'due_soon';
    if (filter === 'due_10')   return r.diff >= 0 && r.diff <= 10;
    if (filter === 'upcoming') return r.diff >= -3;
    return true;
  }).sort((a, b) => filter === 'overdue' ? b.dueDate.localeCompare(a.dueDate) : a.dueDate.localeCompare(b.dueDate));

  const overdueCnt  = rows.filter(r => r.status === 'overdue').length;
  const soonCnt     = rows.filter(r => r.status === 'due_soon').length;
  const upcomingCnt = rows.filter(r => r.status === 'upcoming').length;

  const rowBg  = s => s === 'overdue' ? 'bg-red-50' : s === 'due_soon' ? 'bg-orange-50' : '';
  const badge  = s => s === 'overdue'
    ? 'bg-red-100 text-red-700'
    : s === 'due_soon'
    ? 'bg-orange-100 text-orange-700'
    : 'bg-blue-100 text-blue-700';
  const label  = (s, d) => d < 0
    ? `${Math.abs(d)} დღე ვადაგადასული!`
    : d === 0 ? 'დღეს!'
    : d === 1 ? 'ხვალ'
    : `${d} დღეში`;

  return (
    <div className="p-4 max-w-5xl mx-auto">

function PrepayStatsView() {
  const [schedule, setSchedule] = useState([]);
  const [rate, setRate] = useState(2.68);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    // Whole season — include finished tours too, for a complete picture.
    Promise.all([
      fetch(`${API}/payments/schedule?from_date=2026-01-01&to_date=2026-12-31`).then(r => r.json()),
      fetch(`${API}/exchange-rate`).then(r => r.json()).catch(() => ({rate: 2.68})),
    ]).then(([sched, rt]) => {
      setSchedule(sched);
      if (rt && rt.rate) setRate(rt.rate);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  const today = toISO(new Date());

  // ── Aggregate by due date ──
  const byDate = {};
  schedule.forEach(p => {
    if (!p.total_amount || p.total_amount <= 0) return;
    if (!byDate[p.due_date]) byDate[p.due_date] = { gel: 0, usd: 0 };
    if (p.currency === 'USD') byDate[p.due_date].usd += p.total_amount;
    else byDate[p.due_date].gel += p.total_amount;
  });
  const dates     = Object.keys(byDate).sort();
  const usdArr    = dates.map(d => Math.round(byDate[d].usd));
  const gelArr    = dates.map(d => byDate[d].gel);
  const gelUsdArr = dates.map(d => Math.round(byDate[d].gel / rate));
  const totalGel  = gelArr.reduce((a, b) => a + b, 0);
  const totalUsd  = usdArr.reduce((a, b) => a + b, 0);

  // ── Aggregate by tour (total prepayment per tour, in USD) ──
  const byTour = {};
  schedule.forEach(p => {
    if (!p.total_amount || p.total_amount <= 0) return;
    const usd = p.currency === 'USD' ? p.total_amount : p.total_amount / rate;
    if (!byTour[p.tour_code]) byTour[p.tour_code] = { usd: 0, first: p.first_service_date || '' };
    byTour[p.tour_code].usd += usd;
    if (p.first_service_date && p.first_service_date < byTour[p.tour_code].first)
      byTour[p.tour_code].first = p.first_service_date;
  });
  const tourCodes  = Object.keys(byTour).sort((a, b) =>
    (byTour[a].first || '').localeCompare(byTour[b].first || '') || a.localeCompare(b));
  const tourUsd    = tourCodes.map(c => Math.round(byTour[c].usd));
  const tourColors = tourCodes.map(c => SERIES_COLORS[c.split('-')[0]] || '#888');

  const dailyTip = c => c.datasetIndex === 1
    ? `ლარი: ₾${Math.round(gelArr[c.dataIndex]).toLocaleString()} (≈$${c.parsed.y.toLocaleString()})`
    : `დოლარი: $${c.parsed.y.toLocaleString()}`;
  const tourTip = c => `${c.label}: $${c.parsed.y.toLocaleString()}`;

  return (
    <div className="p-4 max-w-5xl mx-auto">
      <div className="grid grid-cols-3 gap-3 mb-5">
        <div className="bg-blue-50 border border-blue-200 rounded-lg px-4 py-3">
          <div className="text-xs text-blue-600 mb-0.5">სულ საჭირო (დოლარი)</div>
          <div className="text-2xl font-bold text-blue-700">${totalUsd.toLocaleString()}</div>
        </div>
        <div className="bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-3">
          <div className="text-xs text-emerald-600 mb-0.5">სულ საჭირო (ლარი)</div>
          <div className="text-2xl font-bold text-emerald-700">₾{Math.round(totalGel).toLocaleString()}</div>
        </div>
        <div className="bg-gray-50 border border-gray-200 rounded-lg px-4 py-3">
          <div className="text-xs text-gray-500 mb-0.5">კურსი ₾/$ (ეროვნ. ბანკი)</div>
          <div className="text-2xl font-bold text-gray-700">{rate}</div>
        </div>
      </div>

      {loading ? <Spinner/> : dates.length === 0 ? (
        <div className="text-center py-16 text-gray-400 text-sm">წინასწარი გადასახდელი არ არის</div>
      ) : (
        <div className="space-y-6">
          <div className="bg-white rounded-lg shadow-sm p-4">
            <div className="flex items-center gap-4 mb-3">
              <div className="text-sm font-semibold text-gray-700">დღიური წინასწარი გადასახდელი</div>
              <span className="flex items-center gap-1 text-xs text-gray-500"><span className="w-3 h-3 rounded-sm" style={{background:'#3b82f6'}}/>დოლარი $</span>
              <span className="flex items-center gap-1 text-xs text-gray-500"><span className="w-3 h-3 rounded-sm" style={{background:'#10b981'}}/>ლარი ₾ (→$)</span>
              <span className="text-xs text-red-500">წითელი = დღეს</span>
            </div>
            <ScrollBarChart
              labels={dates}
              datasets={[
                { label: 'დოლარი $', data: usdArr, backgroundColor: '#3b82f6', borderRadius: 3 },
                { label: 'ლარი ₾ (→$)', data: gelUsdArr, backgroundColor: '#10b981', borderRadius: 3 },
              ]}
              highlightLabel={today} centerLabel={today} tooltipLabel={dailyTip}/>
          </div>

          <div className="bg-white rounded-lg shadow-sm p-4">
            <div className="text-sm font-semibold text-gray-700 mb-3">წინასწარი ხარჯი ტურების მიხედვით (USD-ში)</div>
            <ScrollBarChart
              labels={tourCodes}
              datasets={[{ label: 'წინასწარი ხარჯი $', data: tourUsd, backgroundColor: tourColors, borderRadius: 3 }]}
              colWidth={40} tooltipLabel={tourTip}/>
          </div>
        </div>
      )}
    </div>
  );
}

// ── CASH FLOW VIEW (client revenue: advances + balances) ───────
function CashFlowView() {
  const [tours, setTours] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tableFilter, setTableFilter] = useState('upcoming');

  useEffect(() => {
    fetch(`${API}/tours`).then(r => r.json())
      .then(d => { setTours(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const today = toISO(new Date());

  // 60% advance on tour start day; 40% balance 10 days after tour end.
  const byDate = {};
  const byDateEvents = {};
  let totalAdv = 0, totalBal = 0;
  tours.forEach(t => {
    const price = TOUR_PRICE[t.series] || 0;
    if (!price) return;
    const adv = Math.round(price * 0.6), bal = Math.round(price * 0.4);
    const advDate = addDays(t.bus_start, -1);
    const balDate = addDays(t.bus_end, 10);
    (byDate[advDate] = byDate[advDate] || { adv: 0, bal: 0 }).adv += adv;
    (byDate[balDate] = byDate[balDate] || { adv: 0, bal: 0 }).bal += bal;
    (byDateEvents[advDate] = byDateEvents[advDate] || []).push({ code: t.code, series: t.series, type: 'advance', amount: adv });
    (byDateEvents[balDate] = byDateEvents[balDate] || []).push({ code: t.code, series: t.series, type: 'balance', amount: bal });
    totalAdv += adv; totalBal += bal;
  });
  const dates   = Object.keys(byDate).sort();
  const advArr  = dates.map(d => byDate[d].adv);
  const balArr  = dates.map(d => byDate[d].bal);

  const eventDates = Object.keys(byDateEvents).sort();
  // "upcoming" also shows the previous 3 days so recent items aren't missed
  const shownDates = eventDates.filter(d => tableFilter === 'all' || d >= addDays(today, -3));
  Object.values(byDateEvents).forEach(evs =>
    evs.sort((a, b) => (a.type === b.type ? a.code.localeCompare(b.code) : a.type === 'advance' ? -1 : 1)));

  const tip = c => c.datasetIndex === 0
    ? `ავანსი (60%): $${c.parsed.y.toLocaleString()}`
    : `ბალანსი (40%): $${c.parsed.y.toLocaleString()}`;

  return (
    <div className="p-4 max-w-5xl mx-auto">
      <div className="grid grid-cols-3 gap-3 mb-5">
        <div className="bg-teal-50 border border-teal-200 rounded-lg px-4 py-3">
          <div className="text-xs text-teal-600 mb-0.5">სულ ავანსები (60%)</div>
          <div className="text-2xl font-bold text-teal-700">${totalAdv.toLocaleString()}</div>
        </div>
        <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3">
          <div className="text-xs text-amber-600 mb-0.5">სულ ბალანსები (40%)</div>
          <div className="text-2xl font-bold text-amber-700">${totalBal.toLocaleString()}</div>
        </div>
        <div className="bg-gray-50 border border-gray-200 rounded-lg px-4 py-3">
          <div className="text-xs text-gray-500 mb-0.5">სულ შემოსავალი</div>
          <div className="text-2xl font-bold text-gray-700">${(totalAdv + totalBal).toLocaleString()}</div>
        </div>
      </div>

      {loading ? <Spinner/> : dates.length === 0 ? (
        <div className="text-center py-16 text-gray-400 text-sm">მონაცემები არ არის</div>
      ) : (
        <div className="bg-white rounded-lg shadow-sm p-4">
          <div className="flex items-center gap-4 mb-3 flex-wrap">
            <div className="text-sm font-semibold text-gray-700">შემოსავლის მოძრაობა დღეების მიხედვით</div>
            <span className="flex items-center gap-1 text-xs text-gray-500"><span className="w-3 h-3 rounded-sm" style={{background:'#14b8a6'}}/>ავანსი 60% (ტურის დაწყება)</span>
            <span className="flex items-center gap-1 text-xs text-gray-500"><span className="w-3 h-3 rounded-sm" style={{background:'#f59e0b'}}/>ბალანსი 40% (დასრულება +10 დღე)</span>
            <span className="text-xs text-red-500">წითელი = დღეს</span>
          </div>
          <ScrollBarChart
            labels={dates}
            datasets={[
              { label: 'ავანსი 60%', data: advArr, backgroundColor: '#14b8a6', borderRadius: 3 },
              { label: 'ბალანსი 40%', data: balArr, backgroundColor: '#f59e0b', borderRadius: 3 },
            ]}
            highlightLabel={today} centerLabel={today} tooltipLabel={tip}/>
        </div>
      )}

      {!loading && eventDates.length > 0 && (
        <div className="bg-white rounded-lg shadow-sm p-4 mt-6">
          <div className="flex items-center gap-3 mb-3 flex-wrap">
            <div className="text-sm font-semibold text-gray-700">თარიღების მიხედვით — რომელი ტურის ფული შემოდის</div>
            <div className="ml-auto flex gap-2">
              {[['upcoming','მომავალი'],['all','ყველა']].map(([v,l]) => (
                <button key={v} onClick={() => setTableFilter(v)}
                  className={`px-3 py-1 rounded text-xs ${tableFilter===v ? 'bg-slate-700 text-white' : 'bg-white border hover:bg-gray-50'}`}>{l}</button>
              ))}
            </div>
          </div>
          <div className="space-y-2">
            {shownDates.map(d => {
              const evs = byDateEvents[d];
              const tot = evs.reduce((s, e) => s + e.amount, 0);
              const isToday = d === today;
              return (
                <div key={d} className={`border rounded-lg overflow-hidden ${isToday ? 'border-red-300' : 'border-gray-200'}`}>
                  <div className={`px-3 py-1.5 flex items-center gap-2 text-xs ${isToday ? 'bg-red-50 text-red-700' : 'bg-gray-50 text-gray-600'}`}>
                    <span className="font-bold">{d}</span>
                    {isToday && <span className="font-bold">დღეს</span>}
                    <span className="ml-auto font-bold text-gray-800">$ {tot.toLocaleString()}</span>
                  </div>
                  <div className="divide-y">
                    {evs.map((e, i) => (
                      <div key={i} className="px-3 py-2 flex items-center gap-2">
                        <Badge series={e.series}/>
                        <span className="text-xs font-bold text-gray-700 w-20 flex-shrink-0">{e.code}</span>
                        <span className={`text-xs font-medium px-1.5 py-0.5 rounded flex-shrink-0 ${e.type==='advance' ? 'bg-teal-100 text-teal-700' : 'bg-amber-100 text-amber-700'}`}>
                          {e.type==='advance' ? 'ავანსი 60%' : 'ბალანსი 40%'}
                        </span>
                        <span className="ml-auto text-sm font-bold text-gray-800">${e.amount.toLocaleString()}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

          <button onClick={save} disabled={saving || !form.vendor_name.trim()}
            className="px-5 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 disabled:opacity-50 font-medium">
            {saving ? '...' : editId ? 'განახლება' : 'დამატება'}
          </button>
          {editId && <button onClick={() => { setForm(EMPTY); setEditId(null); }}
            className="px-4 py-2 bg-gray-200 rounded text-sm hover:bg-gray-300">გაუქმება</button>}
        </div>
      </div>

      <div className="bg-white rounded-lg shadow overflow-hidden">
        <div className="px-4 py-3 border-b bg-gray-50 flex items-center justify-between">
          <span className="font-semibold text-sm">გადახდის პირობები ({terms.length})</span>
          <span className="text-xs text-gray-500">სასტ./რესტ. სახელი უნდა ემთხვეოდეს DB-ში</span>
        </div>
        {loading ? <Spinner/> : terms.length === 0 ? (
          <div className="text-center py-10 text-gray-400 text-sm">პირობები არ არის. დაამატე ზემოთ.</div>
        ) : (
          <table className="w-full text-sm">
            <thead className="border-b bg-gray-50">
              <tr>
                {['ვენდორი','ტიპი','გადახდა','დღე','ფასი','შენ.',''].map(h => (
                  <th key={h} className="text-left px-4 py-2 text-xs font-semibold text-gray-500">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {terms.map(t => (
                <tr key={t.id} className={`border-b hover:bg-gray-50 ${editId===t.id ? 'bg-blue-50' : ''}`}>
                  <td className="px-4 py-2.5 font-medium">{t.vendor_name}</td>
                  <td className="px-4 py-2.5">
                    <span className={`px-2 py-0.5 rounded text-xs ${t.vendor_type==='hotel'?'bg-blue-100 text-blue-700':t.vendor_type==='other'?'bg-purple-100 text-purple-700':'bg-orange-100 text-orange-700'}`}>
                      {t.vendor_type==='hotel'?'🏨 სასტ.':t.vendor_type==='other'?'👤 სხვა':'🍽️ რესტ.'}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 text-gray-600 text-xs">
                    <span className={`px-2 py-0.5 rounded ${t.timing==='before'?'bg-purple-100 text-purple-700':'bg-green-100 text-green-700'}`}>
                      {t.timing==='before'?'შეს.-მდე':'შემდეგ'}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 font-bold text-gray-700">{t.days_offset} დღ.</td>
                  <td className="px-4 py-2.5 text-sm font-semibold text-emerald-700">
                    {t.unit_price > 0
                      ? (t.vendor_type==='hotel'
                          ? `${t.currency==='USD'?'$':'₾'}${(t.unit_price*10).toFixed(0)}`
                          : `${t.currency==='USD'?'$':'₾'}${t.unit_price}`)
                      : '—'}
                  </td>
                  <td className="px-4 py-2.5 text-gray-400 text-xs max-w-xs truncate">{t.notes||'—'}</td>
                  <td className="px-4 py-2.5 flex gap-2">
                    <button onClick={() => startEdit(t)} className="text-blue-400 hover:text-blue-600 text-xs">✏️</button>
                    <button onClick={() => del(t.id)} className="text-red-400 hover:text-red-600 text-xs">✕</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <div className="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-4 text-xs text-amber-700">
        <strong>მნიშვნელოვანი:</strong> ვენდორის სახელი <strong>ზუსტად</strong> უნდა ემთხვეოდეს daily_log-ში შენახულ სახელს.
        მაგ: <code>Pullman Tbilisi</code>, <code>ხAReba</code>, <code>Marco Polo Gudauri</code>.
        Autocomplete-ში ჩანს DB-ში დაფიქსირებული სახელები.
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("day");
  const [selectedTour, setSelectedTour] = useState(null);

  const handleSelectTour = code => { setSelectedTour(code); setTab("detail"); };

  const tabs = [
    {id:"timeline",   label:"📊 Timeline"},
    {id:"day",        label:"📅 დღის ხედი"},
    {id:"detail",     label:"🔍 ტურის დეტალი"},
    {id:"payments",   label:"💳 წინასწარ გადასახდელი"},
    {id:"prepaystat", label:"📈 წინასტატი"},
    {id:"buses",      label:"🚌 ავტობუსები"},
    {id:"cashflow",   label:"💵 ავანსი/ბალანსი"},
    {id:"settings",   label:"⚙️ პარამეტრები"},
  ];

  return (
    <div className="min-h-screen bg-gray-100">
      <header className="bg-slate-900 text-white shadow-lg">
        <div className="max-w-screen-xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
          <div>
            <div className="font-bold text-lg">ki.360</div>
          </div>
          <div className="text-xs text-slate-400">
            {new Date().toLocaleDateString("ka-GE",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
          </div>
        </div>
        <div className="border-t border-slate-700">
          <div className="max-w-screen-xl mx-auto px-4 flex">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-5 py-3 text-sm font-medium transition-colors ${
                  tab === t.id ? "border-b-2 border-amber-400 text-white" : "text-slate-400 hover:text-white"
                }`}>{t.label}</button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-screen-xl mx-auto">
        {tab === "timeline"   && <TimelineView onSelectTour={handleSelectTour}/>}
        {tab === "day"        && <DayView onSelectTour={handleSelectTour}/>}
        {tab === "detail"     && <TourDetailView initialCode={selectedTour} onBack={() => setTab("day")}/>}
        {tab === "payments"   && <PaymentsView/>}
        {tab === "prepaystat" && <PrepayStatsView/>}
        {tab === "buses"      && <BusView/>}
        {tab === "cashflow"   && <CashFlowView/>}
        {tab === "settings"   && <SettingsView/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
