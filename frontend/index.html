// ── STATS VIEW (per-component tour analytics 2026) ─────────────
const STAT_COMPONENTS = [
  ['restaurant', 'რესტორანი',   '#f59e0b'],
  ['hotel',      'სასტუმრო',    '#3b82f6'],
  ['bus',        'ავტობუსი',     '#10b981'],
  ['attraction', 'ატრაქციონები', '#8b5cf6'],
  ['guide',      'გიდი',         '#ec4899'],
  ['staff',      'პერსონალი',    '#14b8a6'],
  ['other',      'სხვა',         '#94a3b8'],
  ['armenia',    'სომხეთი',      '#ef4444'],
  ['azerbaijan', 'აზერბაიჯანი',  '#0ea5e9'],
];

// Visual grouping only: Armenia and Azerbaijan are both a short, bundled
// leg abroad, so they're shown together under one heading — but each keeps
// its own total and its own colour; nothing about how costs are counted or
// compared changes. A single-key group renders exactly like a bare entry.
// Ordered last, after every domestic category, to match STAT_COMPONENTS.
const STAT_GROUPS = [
  { label: null,            keys: ['restaurant'] },
  { label: null,            keys: ['hotel'] },
  { label: null,            keys: ['bus'] },
  { label: null,            keys: ['attraction'] },
  { label: null,            keys: ['guide'] },
  { label: null,            keys: ['staff'] },
  { label: null,            keys: ['other'] },
  { label: 'საზღვარგარეთ', keys: ['armenia', 'azerbaijan'] },
];
const componentOf = k => STAT_COMPONENTS.find(([key]) => key === k);

// What each cost is divided by before tours are compared: a head/room count,
// a length, or both. Chosen from how much each option actually tightens the
// spread between series (measured on 2026 data, CV = spread across series):
//   hotel  ÷ room ÷ night   32% → 10%      guide ÷ day         22% →  9%
//   meals  ÷ guest ÷ day    24% → 13%      tickets ÷ guest ÷ day 27% → 17%
// Armenia is a fixed 1-2 night leg, so dividing it by the whole tour's length
// penalises short tours and made it worse (19% → 26%) — it stays per guest.
// Azerbaijan is billed the same way — one bundled guide/hotel/bus line for a
// short leg some series still run — so it gets the same basis.
// Bus and staff don't unify (a sprinter and a coach are different vehicles;
// staff cost follows the itinerary), so their baseline stays per series.
const COST_BASIS = {
  restaurant: { per: 'pax',   time: 'days'   },
  attraction: { per: 'pax',   time: 'days'   },
  armenia:    { per: 'pax',   time: null     },
  azerbaijan: { per: 'pax',   time: null     },
  hotel:      { per: 'rooms', time: 'nights' },
  bus:        { per: null,    time: 'days'   },
  guide:      { per: null,    time: 'days'   },
  staff:      { per: null,    time: 'days'   },
  other:      { per: null,    time: 'days'   },
  profit:     { per: 'pax',   time: 'days'   },
};

// Parse "19+1" → 19 (tourist count, excluding guide)
const parsePax = paxStr => {
  if (!paxStr) return null;
  const m = String(paxStr).match(/^(\d+)/);
  return m ? parseInt(m[1]) : null;
};

// Parse "9T+1S+1SL" → 11 (total rooms booked)
const parseRooms = roomsStr => {
  if (!roomsStr) return null;
  let total = 0, m;
  const re = /(\d+)\s*(TG|SL|SG|T|S|D|K)/gi;
  while ((m = re.exec(roomsStr))) total += parseInt(m[1]);
  return total || null;
};

const median = arr => {
  if (!arr.length) return 0;
  const s = arr.slice().sort((a, b) => a - b);
  const mid = s.length >> 1;
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
};

function TourDetailPanel({ r, perPax }) {
  const items = r.components_detail || [];
  if (!items.length) return <div className="text-xs text-gray-400 px-4 py-2">დეტალური ჩანაწერები არ არის</div>;

  const paxCount = parsePax(r.pax);
  const divisor = (perPax && paxCount) ? paxCount : 1;

  const bycat = {};
  items.forEach(it => {
    if (!bycat[it.cat]) bycat[it.cat] = [];
    bycat[it.cat].push(it);
  });

  const fmtV = usd => {
    if (!usd && usd !== 0) return '—';
    const v = usd / divisor;
    return divisor > 1 ? `$${v.toFixed(1)}` : `$${Math.round(v).toLocaleString()}`;
  };

  return (
    <div className="px-4 py-3 bg-slate-50 border-t">
      {perPax && paxCount && (
        <div className="text-xs text-slate-500 mb-2 flex items-center gap-1.5">
          <span className="bg-slate-200 text-slate-600 rounded px-1.5 py-0.5 font-mono font-bold">÷{paxCount}</span>
          <span>ნაჩვენებია 1 სტუმარზე (ჯგ. {r.pax})</span>
        </div>
      )}
      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
        {STAT_GROUPS.map(g => {
          const present = g.keys.filter(k => bycat[k] && bycat[k].length);
          if (!present.length) return null;

          const card = k => {
            const [, label, color] = componentOf(k);
            const catItems = bycat[k];
            const catTotal = catItems.reduce((a, it) => a + it.usd, 0);
            return (
              <div key={k} className="bg-white rounded-lg border shadow-sm overflow-hidden">
                <div className="px-3 py-1.5 flex items-center justify-between" style={{background: color}}>
                  <span className="text-xs font-bold text-white">{label}</span>
                  <span className="text-xs font-bold text-white/90">{fmtV(catTotal)}</span>
                </div>
                <div className="divide-y">
                  {catItems.map((it, i) => (
                    <div key={i} className="flex items-center justify-between px-3 py-1.5 gap-2">
                      <span className="text-xs text-gray-700 leading-tight flex-1 min-w-0 truncate" title={it.name}>{it.name}</span>
                      <div className="flex-shrink-0 text-right">
                        <span className="text-xs font-semibold text-gray-800">{fmtV(it.usd)}</span>
                        {perPax && paxCount && (
                          <span className="text-xs text-gray-400 ml-1">(${Math.round(it.usd)})</span>
                        )}
                      </div>
                    </div>
                  ))}
                  {catItems.length > 1 && (
                    <div className="flex items-center justify-between px-3 py-1.5 bg-gray-50">
                      <span className="text-xs text-gray-400">ჯამი</span>
                      <div className="text-right">
                        <span className="text-xs font-bold text-gray-700">{fmtV(catTotal)}</span>
                        {perPax && paxCount && (
                          <span className="text-xs text-gray-400 ml-1">(${Math.round(catTotal)})</span>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          };

          // A labelled group (Armenia/Azerbaijan) gets its own boxed, titled
          // area holding both cards — a display grouping only, so a tour
          // that only visited one still shows just the one card inside it.
          if (!g.label) return card(present[0]);
          return (
            <div key={g.label} className="sm:col-span-2 rounded-lg border-2 border-sky-100 bg-sky-50/50 p-2">
              <div className="text-[10px] font-semibold text-sky-500 uppercase tracking-wide mb-1.5 px-0.5">{g.label}</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {present.map(card)}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function StatsView({ src = '/tour-profit', syncPath = '/sync-profit',
                     colors = SERIES_COLORS }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [sFilter, setSFilter] = useState('all');
  const [expanded, setExpanded] = useState({});
  const [perPax, setPerPax] = useState(false);
  const [syncing, setSyncing] = useState(false);

  const loadData = () => {
    fetch(`${API}${src}`).then(r => r.json())
      .then(d => { setRows(d); setLoading(false); })
      .catch(() => setLoading(false));
  };

  useEffect(() => { loadData(); }, []);

  const handleSync = () => {
    setSyncing(true);
    fetch(`${API}${syncPath}`, {method: 'POST'})
      .then(() => loadData())
      .catch(() => {})
      .finally(() => setSyncing(false));
  };

  const fmt = n => (n || n === 0) ? Math.round(n).toLocaleString() : '—';
  const fmtDec = n => (n || n === 0) ? n.toFixed(1) : '—';
  const toggleRow = code => setExpanded(e => ({...e, [code]: !e[code]}));

  // Only completed tours with full balance data (active/upcoming have partial expenses).
  const sold = rows.filter(r =>
    (r.revenue_usd || 0) > 0 &&
    r.components && Object.keys(r.components).length &&
    ['finished', 'paid', 'done'].includes(r.status)
  );
  const scope = sold.filter(r => sFilter === 'all' || r.series === sFilter)
                    .slice().sort((a, b) => (a.bus_start || '').localeCompare(b.bus_start || ''));

  // What the cell PRINTS: raw totals, or ÷ pax when the toggle is on. Unchanged.
  const norm = (val, r) => {
    if (!perPax) return val || 0;
    const p = parsePax(r.pax);
    return p ? (val || 0) / p : null;
  };

  // What the cell's COLOUR is judged on — always, whatever is being printed.
  // Divided by its COST_BASIS so a long tour or a big group isn't red for being
  // long or big. Null when a divisor is missing: the cell prints its number but
  // stays uncoloured rather than being compared on a guess.
  const fairVal = (val, r, k) => {
    const b = COST_BASIS[k] || { per: 'pax', time: null };
    let div = 1;
    if (b.per === 'pax') {
      const p = parsePax(r.pax);
      if (!p) return null;
      div *= p;
    } else if (b.per === 'rooms') {
      const rm = parseRooms(r.rooms);
      if (!rm) return null;
      div *= rm;
    }
    if (b.time) {
      const t = r[b.time];
      if (!t) return null;
      div *= t;
    }
    return (val || 0) / div;
  };

  const meanSd = vals => {
    const m = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    const sd = vals.length ? Math.sqrt(vals.reduce((a, v) => a + (v - m) ** 2, 0) / vals.length) : 0;
    return { mean: m, sd };
  };

  const stats = {};
  STAT_COMPONENTS.forEach(([k]) => {
    stats[k] = meanSd(scope.map(r => norm(r.components[k] || 0, r)).filter(v => v !== null));
  });

  // Colour baseline: the median of the SAME series, not of the whole table.
  // A 9-day ZT and a 6-day KT are never compared, so red stops meaning
  // "this is the long tour" and starts meaning "this one really overspent".
  // Median rather than mean so a single outlier can't shift the scale.
  // A series needs a few tours before its own median means anything — below
  // that, one atypical tour would paint its neighbour red. Those fall back to
  // the median of every tour on screen, which the per-unit division above makes
  // a fair comparison even across series of different lengths.
  const MIN_SAMPLE = 4;
  const medBy = (getVal) => {
    const bySeries = {}, all = [];
    scope.forEach(r => {
      const v = getVal(r);
      if (v === null || v === undefined) return;
      (bySeries[r.series] = bySeries[r.series] || []).push(v);
      all.push(v);
    });
    const overall = all.length ? median(all) : null;
    const out = { _all: overall };
    Object.keys(bySeries).forEach(s => {
      out[s] = bySeries[s].length >= MIN_SAMPLE ? median(bySeries[s]) : overall;
    });
    return out;
  };
  const baseFor = (m, series) => !m ? null : (m[series] != null ? m[series] : m._all);
  const seriesMed = {};
  STAT_COMPONENTS.forEach(([k]) => {
    seriesMed[k] = medBy(r => fairVal(r.components[k] || 0, r, k));
  });
  const profitMed = medBy(r => fairVal(r.profit_usd, r, 'profit'));

  const profitVals = scope.map(r => norm(r.profit_usd || 0, r)).filter(v => v !== null);
  const spentVals  = scope.map(r => norm(r.spent_usd  || 0, r)).filter(v => v !== null);
  const avgProfit = profitVals.length ? profitVals.reduce((a, b) => a + b, 0) / profitVals.length : 0;
  const avgSpent  = spentVals.length  ? spentVals.reduce((a, b) => a + b, 0)  / spentVals.length  : 0;

  // Average pax across the scope (for info card).
  const paxCounts = scope.map(r => parsePax(r.pax)).filter(Boolean);
  const avgPax = paxCounts.length ? Math.round(paxCounts.reduce((a, b) => a + b, 0) / paxCounts.length) : null;

  // Which component swings the most.
  const ranked = STAT_COMPONENTS.map(([k, label, color]) => ({k, label, color, ...stats[k]}))
    .sort((a, b) => b.sd - a.sd);
  const maxMean = Math.max(1, ...STAT_COMPONENTS.map(([k]) => stats[k].mean));

  // Cell tint by deviation from the series baseline: ±10% is normal, ±25% stands out.
  const devCls = (val, base) => {
    if (val === null || !base) return 'text-gray-400';
    const d = (val - base) / base;
    if (d >  0.25) return 'bg-red-100 text-red-700 font-semibold';
    if (d >  0.10) return 'bg-red-50 text-red-600';
    if (d < -0.25) return 'bg-green-100 text-green-700 font-semibold';
    if (d < -0.10) return 'bg-green-50 text-green-600';
    return 'text-gray-500';
  };
  const profitCls = (p, s) => {
    const base = baseFor(profitMed, s);
    if (p === null || !base) return 'text-gray-400';
    return p > base * 1.1 ? 'bg-green-100 text-green-700'
         : p < base * 0.9 ? 'bg-red-100 text-red-700'
         : 'text-gray-700';
  };

  const unit = perPax ? '/კაცი' : '/ტური';
  const fmtCell = v => v === null ? '?' : perPax ? fmtDec(v) : fmt(v);

  return (
    <div className="p-4 max-w-7xl mx-auto">
      {/* Filters + per-pax toggle */}
      <div className="flex gap-2 mb-4 flex-wrap items-center">
        <span className="text-xs text-gray-400 mr-1">სერია:</span>
        <button onClick={() => setSFilter('all')}
          className={`px-3 py-1 rounded text-xs ${sFilter==='all' ? 'bg-slate-700 text-white' : 'bg-white border hover:bg-gray-50'}`}>ყველა</button>
        {Object.keys(colors).map(s => (
          <button key={s} onClick={() => setSFilter(s)}
            className={`px-3 py-1 rounded text-xs font-bold ${sFilter===s ? 'text-white' : 'bg-white border hover:bg-gray-50'}`}
            style={sFilter===s ? {background: colors[s]} : {color: colors[s]}}>{s}</button>
        ))}
        <button onClick={handleSync} disabled={syncing}
          className="px-3 py-1.5 text-xs font-semibold bg-white border rounded-lg shadow-sm hover:bg-gray-50 disabled:opacity-50 flex items-center gap-1.5">
          <span className={syncing ? 'animate-spin inline-block' : ''}>⟳</span>
          {syncing ? 'სინქრო...' : 'განახლება'}
        </button>
        <div className="ml-2 flex items-center gap-1 bg-white border rounded-lg overflow-hidden shadow-sm">
          <button onClick={() => setPerPax(false)}
            className={`px-3 py-1.5 text-xs font-semibold transition-colors ${!perPax ? 'bg-slate-700 text-white' : 'text-gray-500 hover:bg-gray-50'}`}>
            ჯამური
          </button>
          <button onClick={() => setPerPax(true)}
            className={`px-3 py-1.5 text-xs font-semibold transition-colors ${perPax ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:bg-gray-50'}`}>
            👤 კაცზე
          </button>
        </div>
      </div>

      {loading ? <Spinner/> : scope.length === 0 ? (
        <div className="text-center py-16 text-gray-400 text-sm">მონაცემები არ არის</div>
      ) : (
      <>
        {/* Summary cards */}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          <div className="bg-green-50 border border-green-200 rounded-lg px-4 py-3">
            <div className="text-xs text-green-600 mb-0.5">საშ. მოგება{unit} ($)</div>
            <div className="text-2xl font-bold text-green-700">${perPax ? fmtDec(avgProfit) : fmt(avgProfit)}</div>
          </div>
          <div className="bg-gray-50 border border-gray-200 rounded-lg px-4 py-3">
            <div className="text-xs text-gray-500 mb-0.5">საშ. ხარჯი{unit} ($)</div>
            <div className="text-2xl font-bold text-gray-700">${perPax ? fmtDec(avgSpent) : fmt(avgSpent)}</div>
          </div>
          {perPax ? (
            <div className="bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-3">
              <div className="text-xs text-indigo-600 mb-0.5">საშ. ჯგ. ზომა (ტურისტი)</div>
              <div className="text-2xl font-bold text-indigo-700">{avgPax ? `${avgPax}` : '—'}</div>
              <div className="text-xs text-indigoply-400 mt-0.5 text-indigo-400">{paxCounts.length} ტური pax-ით</div>
            </div>
          ) : (
            <div className="bg-blue-50 border border-blue-200 rounded-lg px-4 py-3">
              <div className="text-xs text-blue-600 mb-0.5">ყველ. ძვ. კომპ. (საშ.)</div>
              <div className="text-lg font-bold text-blue-700">{ranked[0] && ranked[0].label}</div>
              <div className="text-xs text-blue-500">${fmt(ranked[0] && ranked[0].mean)} საშ.</div>
            </div>
          )}
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3">
            <div className="text-xs text-amber-600 mb-0.5">ყვ. ცვალებადი{perPax ? '/კაცი' : ''}</div>
            <div className="text-lg font-bold text-amber-700">{ranked[0] && ranked[0].label}</div>
            <div className="text-xs text-amber-500">±${perPax ? fmtDec(ranked[0] && ranked[0].sd) : fmt(ranked[0] && ranked[0].sd)} გადახრა</div>
          </div>
        </div>

        {/* Average cost per component — horizontal bars */}
        <div className="bg-white rounded-lg shadow-sm p-4 mb-4">
          <div className="text-sm font-semibold text-gray-700 mb-3">
            საშუალო ხარჯი კომპონენტებზე ({perPax ? '1 სტუმარზე' : '1 ტურზე'})
            {perPax && avgPax && <span className="ml-2 text-xs text-indigo-500 font-normal">საშ. ჯგ. {avgPax} კაცი</span>}
          </div>
          <div className="space-y-1.5">
            {STAT_GROUPS.map(g => (
              <div key={g.keys.join('+')}>
                {g.label && (
                  <div className="text-[10px] font-semibold text-sky-500 uppercase tracking-wide mt-2 mb-0.5 ml-[6.5rem]">{g.label}</div>
                )}
                <div className={g.label ? 'space-y-1.5 pl-2 border-l-2 border-sky-100' : 'space-y-1.5'}>
                  {g.keys.map(k => {
                    const [, label, color] = componentOf(k);
                    return (
                      <div key={k} className="flex items-center gap-2">
                        <div className="w-24 text-xs text-gray-600 text-right flex-shrink-0">{label}</div>
                        <div className="flex-1 bg-gray-100 rounded h-5 relative">
                          <div className="h-5 rounded" style={{width: `${Math.max(2, (stats[k].mean / maxMean) * 100)}%`, background: color}}/>
                        </div>
                        <div className="w-20 text-xs font-semibold text-gray-700 text-right flex-shrink-0">
                          ${perPax ? fmtDec(stats[k].mean) : fmt(stats[k].mean)}
                        </div>
                        <div className="w-16 text-xs text-gray-400 text-right flex-shrink-0">
                          ±{perPax ? fmtDec(stats[k].sd) : fmt(stats[k].sd)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Per-tour component table with expandable detail rows */}
        <div className="bg-white rounded-lg shadow-sm overflow-x-auto">
          <table className="w-full text-xs whitespace-nowrap">
            <thead className="bg-gray-50 border-b">
              {/* Row 1: every column that stands alone, plus one spanning
                  header for the Armenia/Azerbaijan pair (display only). */}
              <tr>
                <th rowSpan="2" className="text-left px-2 py-2 font-semibold text-gray-500 w-4 align-bottom"></th>
                <th rowSpan="2" className="text-left px-2 py-2 font-semibold text-gray-500 align-bottom">ტური</th>
                <th rowSpan="2" className="text-left px-2 py-2 font-semibold text-gray-500 align-bottom">ჯგ.</th>
                <th rowSpan="2" className="text-left px-2 py-2 font-semibold text-gray-400 font-mono align-bottom">ოთახები</th>
                {STAT_GROUPS.map(g => g.label
                  ? <th key={g.label} colSpan={g.keys.length}
                        className="text-center px-2 py-1 font-semibold text-sky-500 text-[10px] uppercase tracking-wide border-b border-sky-100">
                      {g.label}
                    </th>
                  : (() => { const [, label, color] = componentOf(g.keys[0]); return (
                      <th key={g.keys[0]} rowSpan="2" className="text-right px-2 py-2 font-semibold align-bottom" style={{color}}>
                        {label}{perPax ? <span className="text-gray-400 font-normal">/კ</span> : ''}
                      </th>
                    ); })()
                )}
                <th rowSpan="2" className="text-right px-2 py-2 font-semibold text-gray-500 align-bottom">ხარჯი{perPax ? '/კ' : ''}</th>
                <th rowSpan="2" className="text-right px-2 py-2 font-semibold text-gray-500 align-bottom">მოგება{perPax ? '/კ' : ''}</th>
              </tr>
              {/* Row 2: only the columns the row-1 spanning header covers. */}
              <tr>
                {STAT_COMPONENTS.filter(([k]) => STAT_GROUPS.some(g => g.label && g.keys.includes(k)))
                  .map(([k, label, color]) => (
                    <th key={k} className="text-right px-2 py-1.5 font-semibold" style={{color}}>
                      {label}{perPax ? <span className="text-gray-400 font-normal">/კ</span> : ''}
                    </th>
                  ))}
              </tr>
            </thead>
            <tbody>
              {scope.map(r => {
                const isOpen = !!expanded[r.tour_code];
                const hasDetail = (r.components_detail || []).length > 0;
                const normSpent  = norm(r.spent_usd,  r);
                const normProfit = norm(r.profit_usd, r);
                return (
                  <React.Fragment key={r.tour_code}>
                    <tr className={`border-b ${isOpen ? 'bg-slate-50' : 'hover:bg-gray-50'} cursor-pointer`}
                        onClick={() => toggleRow(r.tour_code)}>
                      <td className="px-2 py-1.5 text-gray-400 text-center">
                        {hasDetail ? (isOpen ? '▾' : '▸') : ''}
                      </td>
                      <td className="px-2 py-1.5">
                        <div className="flex items-center gap-1.5">
                          <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: seriesColor(r.series) || r.color}}/>
                          <span className="font-bold text-gray-800">{r.tour_code}</span>
                        </div>
                      </td>
                      <td className="px-2 py-1.5 text-gray-500">{r.pax || '—'}</td>
                      <td className="px-2 py-1.5 text-gray-400 font-mono text-xs">{r.rooms || ''}</td>
                      {STAT_COMPONENTS.map(([k]) => {
                        const raw = r.components[k] || 0;
                        // print the amount as-is, tint it by the per-unit comparison
                        return (
                          <td key={k} className={`px-2 py-1.5 text-right ${devCls(fairVal(raw, r, k), baseFor(seriesMed[k], r.series))}`}>
                            {raw ? fmtCell(norm(raw, r)) : '·'}
                          </td>
                        );
                      })}
                      <td className="px-2 py-1.5 text-right text-gray-700 font-medium">{fmtCell(normSpent)}</td>
                      <td className={`px-2 py-1.5 text-right font-bold rounded ${profitCls(fairVal(r.profit_usd, r, 'profit'), r.series)}`}>
                        ${fmtCell(normProfit)}
                      </td>
                    </tr>
                    {isOpen && (
                      <tr>
                        <td colSpan={4 + STAT_COMPONENTS.length + 2} className="p-0">
                          <TourDetailPanel r={r} perPax={perPax}/>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
            <tfoot>
              <tr className="bg-slate-50 border-t-2 border-slate-200 font-bold">
                <td className="px-2 py-2 text-xs text-gray-500" colSpan="4">
                  საშუალო ({scope.length} ტური{perPax && avgPax ? `, ${avgPax} კაცი` : ''})
                </td>
                {STAT_COMPONENTS.map(([k]) => (
                  <td key={k} className="px-2 py-2 text-right text-gray-700">
                    {perPax ? fmtDec(stats[k].mean) : fmt(stats[k].mean)}
                  </td>
                ))}
                <td className="px-2 py-2 text-right text-gray-700">{perPax ? fmtDec(avgSpent) : fmt(avgSpent)}</td>
                <td className="px-2 py-2 text-right text-green-700">${perPax ? fmtDec(avgProfit) : fmt(avgProfit)}</td>
              </tr>
            </tfoot>
          </table>
          <div className="px-3 py-2 bg-amber-50 border-t text-xs text-amber-700">
            {perPax
              ? <span>ყველა მნიშვნელობა გაყოფილია ტურისტების რაოდენობაზე (გიდი გამოკლებულია). ? = pax უცნობია.</span>
              : <span>მხოლოდ <strong>დასრულებული</strong> ტურები — მიმდინარე/მომავალი გამოტოვებულია (ბალანსი არ არის დახურული). დააჭირეთ სტრიქონს დეტალებისთვის.</span>}
            <span className="ml-2 text-gray-600">ციფრები ჯამურია; <strong>ფერი</strong> კი ითვლება გაყოფილ
              მაჩვენებელზე: რესტორანი / ატრაქციონები — <strong>1 სტუმარზე დღეში</strong> · სასტუმრო —
              <strong>1 ოთახზე ღამეში</strong> · ავტობუსი / გიდი / პერსონალი — <strong>1 დღეზე</strong> ·
              სომხეთი — 1 სტუმარზე (ფიქსირებული მონაკვეთია). შედარება ამავე სერიის მედიანასთან, ხოლო თუ სერიას
              4 ტურზე ნაკლები აქვს — ყველა ტურის საერთო მედიანასთან.</span>
            <span className="ml-1 text-red-600 font-medium">წითელი = +10%-ით მეტი</span>,
            <span className="text-green-700 font-medium"> მწვანე = −10%-ით ნაკლები</span>. ცარიელი (·) = ხარჯი არ ჰქონია.
          </div>
        </div>
        <VendorChart scope={scope} perPax={perPax} />
      </>
      )}
    </div>
  );
}

// ── VENDOR ANALYSIS CHART ─────────────────────────────────────────
function VendorChart({ scope, perPax }) {
  const [cat, setCat] = useState('hotel');
  const [expandedV, setExpandedV] = useState(null);
  const [searchQ, setSearchQ] = useState('');

  const CAT_OPTS = [
    ['hotel',      'სასტუმრო',    '#3b82f6'],
    ['restaurant', 'რესტორანი',   '#f59e0b'],
    ['bus',        'ავტობუსი',    '#10b981'],
    ['armenia',    'სომხეთი',     '#ef4444'],
    ['attraction', 'ატრაქციონები','#8b5cf6'],
    ['guide',      'გიდი',        '#ec4899'],
    ['staff',      'პერსონალი',   '#14b8a6'],
    ['other',      'სხვა',        '#94a3b8'],
  ];
  const [, , catColor] = CAT_OPTS.find(([k]) => k === cat) || CAT_OPTS[0];

  // Build vendor → [{tour_code, series, color, usd, pax}]
  const rawMap = {};
  scope.forEach(r => {
    const pax = parsePax(r.pax);
    (r.components_detail || [])
      .filter(i => i.cat === cat)
      .forEach(i => {
        const v = i.name.trim();
        if (!rawMap[v]) rawMap[v] = [];
        rawMap[v].push({tour_code: r.tour_code, series: r.series, color: r.color, usd: i.usd, pax, itemName: i.name});
      });
  });

  // Normalize name for comparison: strip parenthetical suffixes and extra spaces.
  const normKey = s => s.toLowerCase()
    .replace(/\s*\([^)]*\)/g, ' ')
    .replace(/[()]/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  // Two vendor names are the same only if one normalized form is a substring
  // of the other (e.g. "მარკო პოლო" ⊂ "გუდაური მარკო პოლო").
  // No automatic word-overlap merging — only merge what the user explicitly confirms.
  const isSameVendor = (a, b) => {
    const na = normKey(a), nb = normKey(b);
    return na.includes(nb) || nb.includes(na);
  };

  // Merge: shorter (more generic) name becomes the canonical display key.
  const vendorMap = {};
  Object.keys(rawMap).sort((a, b) => a.length - b.length).forEach(name => {
    const canon = Object.keys(vendorMap).find(c => isSameVendor(c, name));
    if (canon) {
      vendorMap[canon] = vendorMap[canon].concat(rawMap[name]);
    } else {
      vendorMap[name] = rawMap[name].slice();
    }
  });

  const fmt  = n => Math.round(n).toLocaleString();
  const fmtD = n => n.toFixed(1);

  // Full-text search across ALL categories
  const searchResults = (() => {
    const q = searchQ.trim().toLowerCase();
    if (!q) return null;
    const hits = [];
    scope.forEach(r => {
      const pax = parsePax(r.pax);
      (r.components_detail || []).forEach(i => {
        if (i.name.toLowerCase().includes(q)) {
          hits.push({itemName: i.name, cat: i.cat, tour_code: r.tour_code,
                     color: r.color, usd: i.usd, pax});
        }
      });
    });
    return hits.sort((a, b) => b.usd - a.usd);
  })();

  const vendors = Object.entries(vendorMap).map(([name, entries]) => {
    const vals = perPax
      ? entries.filter(e => e.pax).map(e => e.usd / e.pax)
      : entries.map(e => e.usd);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    const sd  = vals.length > 1
      ? Math.sqrt(vals.reduce((a, v) => a + (v - avg) ** 2, 0) / vals.length)
      : 0;
    return {name, entries, avg, sd, count: entries.length};
  }).filter(v => v.avg > 0).sort((a, b) => b.avg - a.avg);

  const maxAvg = Math.max(1, ...vendors.map(v => v.avg));

  return (
    <div className="mt-6 bg-white rounded-xl shadow-sm border">
      {/* Header */}
      <div className="flex items-center gap-3 px-4 py-3 border-b flex-wrap">
        <span className="font-semibold text-gray-700 text-sm">ვენდორების ანალიზი</span>
        <div className="flex gap-1 flex-wrap">
          {CAT_OPTS.map(([k, label, col]) => (
            <button key={k} onClick={() => {setCat(k); setExpandedV(null); setSearchQ('');}}
              className={`px-2 py-1 rounded text-xs font-semibold transition-colors ${cat===k && !searchQ ? 'text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}
              style={cat===k && !searchQ ? {background: col} : {}}>
              {label}
            </button>
          ))}
        </div>
        <div className="ml-auto flex items-center gap-2">
          <input
            value={searchQ}
            onChange={e => setSearchQ(e.target.value)}
            placeholder="🔍 ძებნა..."
            className="px-3 py-1 text-xs border rounded-lg outline-none focus:border-indigo-400 w-40"
          />
          {searchQ && <button onClick={() => setSearchQ('')} className="text-xs text-gray-400 hover:text-gray-600">✕</button>}
        </div>
      </div>

      {/* Search results mode */}
      {searchResults ? (
        searchResults.length === 0 ? (
          <div className="px-4 py-8 text-center text-xs text-gray-400">"{searchQ}" — არ მოიძებნა</div>
        ) : (
          <div className="p-3">
            <div className="text-xs text-gray-400 mb-2 px-1">{searchResults.length} ჩანაწერი · "{searchQ}"</div>
            <div className="space-y-1">
              {searchResults.map((e, i) => {
                const catInfo = CAT_OPTS.find(([k]) => k === e.cat);
                const [, catLabel, catCol] = catInfo || ['','სხვა','#94a3b8'];
                const val = perPax && e.pax ? e.usd / e.pax : e.usd;
                return (
                  <div key={i} className="flex items-center gap-2 py-1.5 px-2 rounded-lg hover:bg-gray-50 text-xs">
                    <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: e.color}}/>
                    <span className="w-20 font-mono text-gray-700 flex-shrink-0">{e.tour_code}</span>
                    <span className="flex-1 text-gray-800 truncate" title={e.itemName}>{e.itemName}</span>
                    <span className="px-1.5 py-0.5 rounded text-white text-xs flex-shrink-0"
                          style={{background: catCol, fontSize: '10px'}}>{catLabel}</span>
                    <span className="w-16 text-right font-semibold text-gray-800 flex-shrink-0">
                      ${perPax && e.pax ? fmtD(val) : fmt(e.usd)}
                    </span>
                    {!perPax && e.pax && (
                      <span className="w-14 text-right text-gray-400 flex-shrink-0">${fmtD(e.usd/e.pax)}/კ.</span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )
      ) : vendors.length === 0 ? (
        <div className="px-4 py-8 text-center text-xs text-gray-400">მონაცემები არ არის</div>
      ) : (
        <div className="p-3 space-y-0.5">
          {vendors.map(({name, entries, avg, sd, count}) => (
            <div key={name}>
              {/* Vendor summary row */}
              <div
                className="flex items-center gap-2 py-2 px-2 cursor-pointer hover:bg-gray-50 rounded-lg group"
                onClick={() => setExpandedV(expandedV === name ? null : name)}>
                <span className="w-4 text-xs text-gray-400 flex-shrink-0 group-hover:text-gray-600">
                  {expandedV === name ? '▾' : '▸'}
                </span>
                <span className="w-44 text-xs text-gray-800 truncate flex-shrink-0 font-medium" title={name}>{name}</span>
                <div className="flex-1 bg-gray-100 rounded-full h-2.5 mx-2 min-w-0">
                  <div className="h-2.5 rounded-full transition-all" style={{width:`${(avg/maxAvg)*100}%`, background: catColor}}/>
                </div>
                <span className="w-20 text-right text-sm font-bold text-gray-800">
                  ${perPax ? fmtD(avg) : fmt(avg)}
                </span>
                <span className="w-16 text-right text-xs text-gray-400">±{perPax ? fmtD(sd) : fmt(sd)}</span>
                <span className="w-12 text-right text-xs text-gray-400 flex-shrink-0">{count} ტ.</span>
              </div>

              {/* Per-tour breakdown */}
              {expandedV === name && (
                <div className="ml-6 mb-2 bg-slate-50 rounded-lg p-3 border border-slate-100">
                  <div className="space-y-1.5">
                    {entries.slice().sort((a, b) => a.tour_code.localeCompare(b.tour_code)).map((e, i) => {
                      const val = perPax && e.pax ? e.usd / e.pax : e.usd;
                      const pct = Math.min(100, (val / maxAvg) * 100);
                      const vsAvg = avg > 0 ? (val - avg) / avg : 0;
                      const diffCls = vsAvg > 0.12 ? 'text-red-600 font-semibold' : vsAvg < -0.12 ? 'text-green-600 font-semibold' : 'text-gray-600';
                      return (
                        <div key={i} className="flex items-center gap-2 text-xs">
                          <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: e.color}}/>
                          <span className="w-20 font-mono text-gray-700 flex-shrink-0">{e.tour_code}</span>
                          <span className="w-48 text-gray-400 truncate flex-shrink-0 italic" title={e.itemName}>{e.itemName}</span>
                          <div className="flex-1 bg-gray-200 rounded-full h-1.5">
                            <div className="h-1.5 rounded-full" style={{width:`${pct}%`, background: e.color, opacity: 0.8}}/>
                          </div>
                          <span className={`w-16 text-right ${diffCls}`}>
                            ${perPax && e.pax ? fmtD(val) : fmt(e.usd)}
                          </span>
                          {e.pax && perPax === false && (
                            <span className="w-16 text-right text-gray-400">
                              ${fmtD(e.usd / e.pax)}/კაც
                            </span>
                          )}
                        </div>
                      );
                    })}
                    {/* Average line */}
                    <div className="flex items-center gap-2 text-xs border-t pt-1.5 mt-1">
                      <span className="w-2 h-2 flex-shrink-0"/>
                      <span className="w-20 text-gray-400 flex-shrink-0">საშ.</span>
                      <div className="flex-1 bg-gray-200 rounded-full h-1.5">
                        <div className="h-1.5 rounded-full bg-gray-500" style={{width:`${(avg/maxAvg)*100}%`}}/>
                      </div>
                      <span className="w-16 text-right font-bold text-gray-700">
                        ${perPax ? fmtD(avg) : fmt(avg)}
                      </span>
                      {!perPax && <span className="w-16"/>}
                    </div>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── DEBTS VIEW (invoices still to arrive, and still to pay) ───
function DebtsView() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [phaseFilter, setPhaseFilter] = useState('open');
  const [sFilter, setSFilter] = useState('all');
  const [expanded, setExpanded] = useState({});
  // Debt as it stood on a chosen day: a tour that hadn't finished by then had
  // not yet run up its bills, so it doesn't count towards that day's total.
  const [asOf, setAsOf] = useState(toISO(new Date()));

  const load = () => fetch(`${API}/tour-debts`).then(r => r.json())
    .then(d => { setRows(d); setLoading(false); })
    .catch(() => setLoading(false));
  useEffect(() => { load(); }, []);

  const doSync = () => {
    setSyncing(true);
    fetch(`${API}/sync-debts`, {method:'POST'}).then(() => load())
      .catch(() => {}).finally(() => setSyncing(false));
  };

  const fmtU = n => (n || n === 0) ? '$' + Math.round(n).toLocaleString() : '—';
  // The working view: anything still un-invoiced or still unpaid.
  const isOpen = r => (r.awaited_usd || 0) > 0 || (r.due_usd || 0) > 0;
  const byPhaseFilter = r =>
    phaseFilter === 'all' ? true :
    phaseFilter === 'open' ? isOpen(r) :
    String(r.phase) === phaseFilter;

  // A tour's costs are dated day by day, so a cutoff part-way through one counts
  // only the nights and meals up to it rather than the whole tour or none of it.
  const asAt = r => {
    if (!asOf) return r;
    const buckets = (r.by_date || []).filter(b => b.date <= asOf);
    if (!buckets.length) {
      // No dated costs yet — nothing of this tour had been incurred by then.
      return (r.bus_start && r.bus_start > asOf)
        ? null
        : {...r, invoiced_usd: 0, awaited_usd: 0, due_usd: 0, paid_usd: 0,
           awaited_count: 0, due_count: 0, lines: []};
    }
    const sum = k => buckets.reduce((a, b) => a + (b[k] || 0), 0);
    const allInvoiced = t => (t.by_date || []).reduce((a, b) => a + (b.invoiced || 0), 0);
    const full = (r.by_date || []).length === buckets.length;
    return {...r,
      invoiced_usd: sum('invoiced'), awaited_usd: sum('awaited'),
      due_usd: sum('due'), paid_usd: sum('paid'),
      // Counts describe whole invoices, so they only hold for a complete tour.
      awaited_count: full ? r.awaited_count : 0,
      due_count: full ? r.due_count : 0,
      // Part-way through a tour, only the share of its costs already incurred is
      // owed, so the estimate is prorated the same way the invoices are.
      estimated_missing_usd: full
        ? r.estimated_missing_usd
        : (r.estimated_missing_usd || 0) * (sum('invoiced') / (allInvoiced(r) || 1)),
      partial: !full};
  };

  // The series buttons narrow everything on the tab — totals, phase tally and
  // table alike — so the figures always describe what is on screen.
  const pool = rows.filter(r => sFilter === 'all' || r.series === sFilter);
  const shown = pool.filter(byPhaseFilter).map(asAt).filter(Boolean)
                    .filter(r => !asOf || (r.invoiced_usd || 0) > 0);
  const laterCount = pool.filter(byPhaseFilter).length - shown.length;

  const sum = k => shown.reduce((a, r) => a + (r[k] || 0), 0);
  const cnt = k => shown.reduce((a, r) => a + (r[k] || 0), 0);
  const byPhase = p => pool.filter(r => r.phase === p).length;

  return (
    <div className="p-4">
      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <h2 className="font-bold text-lg text-gray-700">🧾 დავალიანებები</h2>
        <button onClick={doSync} disabled={syncing}
          className="ml-auto px-3 py-1.5 bg-white border rounded text-sm hover:bg-gray-50 disabled:opacity-50">
          {syncing ? 'განახლება…' : '🔄 განახლება'}
        </button>
      </div>

      {loading ? <Spinner/> : (
      <>
        <div className="grid grid-cols-4 gap-3 mb-4">
          <div className="bg-red-50 border border-red-200 rounded-lg px-4 py-3">
            <div className="text-xs text-red-600 mb-0.5">ინვოისი ჯერ არ მიგვიღია ($)</div>
            <div className="text-2xl font-bold text-red-700">{fmtU(sum('awaited_usd'))}</div>
            <div className="text-xs text-red-500 mt-1">{cnt('awaited_count')} პოზიცია</div>
          </div>
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3">
            <div className="text-xs text-amber-600 mb-0.5">გადასახდელი ($)</div>
            <div className="text-2xl font-bold text-amber-700">{fmtU(sum('due_usd'))}</div>
            <div className="text-xs text-amber-500 mt-1">{cnt('due_count')} ინვოისი</div>
          </div>
          <div className="bg-violet-50 border border-violet-200 rounded-lg px-4 py-3">
            <div className="text-xs text-violet-600 mb-0.5">მოუსვლელი ინვოისები ≈ ($)</div>
            <div className="text-2xl font-bold text-violet-700">{fmtU(sum('estimated_missing_usd'))}</div>
            <div className="text-xs text-violet-500 mt-1">დახურული ტურების სტატისტიკით</div>
          </div>
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-3">
            <div className="text-xs text-emerald-600 mb-0.5">გადახდილი ($)</div>
            <div className="text-2xl font-bold text-emerald-700">{fmtU(sum('paid_usd'))}</div>
            <div className="text-xs text-emerald-500 mt-1">
              ფაზა 1: {byPhase(1)} · ფაზა 2: {byPhase(2)} · ფაზა 3: {byPhase(3)}
            </div>
          </div>
        </div>

        <div className="flex gap-2 mb-3 flex-wrap items-center">
          {[['open','⚠️ ღია'],['1','ფაზა 1'],['2','ფაზა 2'],['3','ფაზა 3'],['all','ყველა']].map(([v,l]) => (
            <button key={v} onClick={() => setPhaseFilter(v)}
              className={`px-3 py-1.5 rounded text-sm border ${phaseFilter===v ? 'bg-slate-700 text-white border-slate-700' : 'bg-white hover:bg-gray-50'}`}>{l}</button>
          ))}
          <span className="ml-3 text-xs text-gray-500">მდგომარეობით:</span>
          <input type="date" value={asOf} onChange={e => setAsOf(e.target.value)}
            className="border rounded px-2 py-1 text-sm"/>
          <button onClick={() => setAsOf(toISO(new Date()))}
            className="px-2 py-1 rounded text-xs border bg-white hover:bg-gray-50">დღეს</button>
          <button onClick={() => setAsOf('')}
            className={`px-2 py-1 rounded text-xs border ${asOf ? 'bg-white hover:bg-gray-50' : 'bg-slate-700 text-white border-slate-700'}`}>
            ყველა თარიღი
          </button>
          {asOf && laterCount > 0 &&
            <span className="text-xs text-gray-400">({laterCount} ტური ამ თარიღამდე არ დაწყებულა)</span>}
        </div>

        <div className="flex gap-2 mb-3 flex-wrap items-center">
          <span className="text-xs text-gray-400 mr-1">სერია:</span>
          <button onClick={() => setSFilter('all')}
            className={`px-3 py-1 rounded text-xs ${sFilter==='all' ? 'bg-slate-700 text-white' : 'bg-white border hover:bg-gray-50'}`}>ყველა</button>
          {Object.keys(SERIES_COLORS).map(s => (
            <button key={s} onClick={() => setSFilter(s)}
              className={`px-3 py-1 rounded text-xs font-bold ${sFilter===s ? 'text-white' : 'bg-white border hover:bg-gray-50'}`}
              style={sFilter===s ? {background: SERIES_COLORS[s]} : {color: SERIES_COLORS[s]}}>{s}</button>
          ))}
        </div>

        {shown.length === 0 ? (
          <div className="bg-white rounded-lg shadow-sm p-10 text-center text-gray-400">
            <div className="text-4xl mb-2">✅</div>
            <div className="text-sm">ამ ფილტრით დავალიანება არ არის</div>
          </div>
        ) : (
        <div className="bg-white rounded-lg shadow-sm overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 border-b">
              <tr>
                <th className="px-2 py-2 w-4"></th>
                <th className="text-left px-3 py-2 text-xs font-semibold text-gray-500">ტური</th>
                <th className="text-left px-3 py-2 text-xs font-semibold text-gray-500">ფაზა</th>
                <th className="text-right px-3 py-2 text-xs font-semibold text-gray-500">სულ ინვოისი</th>
                <th className="text-right px-3 py-2 text-xs font-semibold text-red-600">არ მიგვიღია</th>
                <th className="text-right px-3 py-2 text-xs font-semibold text-violet-600 leading-tight">
                  <div>მოუსვლელი ინვოისი</div><div className="font-normal text-gray-400">≈ სტატისტიკით</div>
                </th>
                <th className="text-right px-3 py-2 text-xs font-semibold text-amber-600">გადასახდელი</th>
                <th className="text-right px-3 py-2 text-xs font-semibold text-emerald-600">გადახდილი</th>
              </tr>
            </thead>
            <tbody>
              {shown.map(r => {
                const open = !!expanded[r.tour_code];
                const ph = PHASES[r.phase];
                const lines = r.lines || [];
                return (
                  <React.Fragment key={r.tour_code}>
                    <tr className={`border-b cursor-pointer ${open ? 'bg-slate-50' : 'hover:bg-gray-50'}`}
                        onClick={() => setExpanded(e => ({...e, [r.tour_code]: !open}))}>
                      <td className="px-2 py-2 text-gray-400 text-center">{lines.length ? (open ? '▾' : '▸') : ''}</td>
                      <td className="px-3 py-2">
                        <div className="flex items-center gap-1.5">
                          <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background: seriesColor(r.series) || r.color}}/>
                          <span className="font-bold text-gray-800">{r.tour_code}</span>
                          {r.partial && <span className="text-[10px] text-amber-600 bg-amber-50 rounded px-1"
                                              title="ტური ამ თარიღზე ჯერ მიმდინარეობდა — ითვლება მხოლოდ გაწეული ნაწილი">ნაწილობრივ</span>}
                        </div>
                        {r.guide && <div className="text-xs text-gray-400">🧭 {r.guide}</div>}
                      </td>
                      <td className="px-3 py-2">
                        {ph ? <span className={`px-2 py-0.5 rounded text-xs font-medium ${ph.cls}`} title={ph.hint}>{ph.label}</span>
                            : <span className="text-gray-300 text-xs">—</span>}
                      </td>
                      <td className="px-3 py-2 text-right text-gray-600">{fmtU(r.invoiced_usd)}</td>
                      <td className={`px-3 py-2 text-right font-semibold ${(r.awaited_usd||0) > 0 ? 'text-red-600' : 'text-gray-300'}`}>
                        {(r.awaited_usd||0) > 0 ? fmtU(r.awaited_usd) : '—'}
                      </td>
                      <td className={`px-3 py-2 text-right ${(r.estimated_missing_usd||0) > 0 ? 'text-violet-600 font-semibold' : 'text-gray-300'}`}
                          title={r.expected_usd ? `მოსალოდნელი სრული ხარჯი ${fmtU(r.expected_usd)}` : ''}>
                        {(r.estimated_missing_usd||0) > 0 ? '≈ ' + fmtU(r.estimated_missing_usd) : '—'}
                      </td>
                      <td className={`px-3 py-2 text-right font-semibold ${(r.due_usd||0) > 0 ? 'text-amber-600' : 'text-gray-300'}`}>
                        {(r.due_usd||0) > 0 ? fmtU(r.due_usd) : '—'}
                      </td>
                      <td className="px-3 py-2 text-right text-emerald-700">{fmtU(r.paid_usd)}</td>
                    </tr>
                    {/* Detail rows share the table's own columns, so each figure
                        sits under the heading it belongs to. */}
                    {open && lines.map((l, i) => (
                      <tr key={`l${i}`} className="bg-slate-50 text-xs border-b border-slate-100">
                        <td className="px-2"></td>
                        <td className="px-3 py-1" colSpan="2">
                          <span className={`px-1.5 py-0.5 rounded whitespace-nowrap ${l.received ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                            {l.received ? 'ინვოისი მოვიდა' : 'ინვოისი არ მოსულა'}
                          </span>
                          <span className="text-gray-700 ml-2">{l.name}</span>
                          {l.note && <span className="text-gray-400 ml-1">({l.note})</span>}
                        </td>
                        <td className="px-3 py-1"></td>
                        <td className="px-3 py-1 text-right font-semibold text-red-600">
                          {!l.received ? fmtU(l.usd) : ''}
                        </td>
                        <td className="px-3 py-1 text-right text-violet-600 whitespace-nowrap"
                            title={l.est_usd != null ? 'ამ პოზიციის საშუალო დახურული ტურებიდან' : ''}>
                          {!l.received && l.est_usd != null ? '≈ ' + fmtU(l.est_usd) : ''}
                        </td>
                        <td className="px-3 py-1 text-right font-semibold text-amber-600">
                          {l.received ? fmtU(l.usd) : ''}
                        </td>
                        <td className="px-3 py-1"></td>
                      </tr>
                    ))}
                  </React.Fragment>
                );
              })}
            </tbody>
            <tfoot>
              <tr className="bg-slate-50 border-t-2 border-slate-200 font-bold">
                <td className="px-3 py-2.5 text-xs text-gray-500" colSpan="3">ჯამი ({shown.length} ტური)</td>
                <td className="px-3 py-2.5 text-right text-gray-700">{fmtU(sum('invoiced_usd'))}</td>
                <td className="px-3 py-2.5 text-right text-red-700">{fmtU(sum('awaited_usd'))}</td>
                <td className="px-3 py-2.5 text-right text-violet-700">{fmtU(sum('estimated_missing_usd'))}</td>
                <td className="px-3 py-2.5 text-right text-amber-700">{fmtU(sum('due_usd'))}</td>
                <td className="px-3 py-2.5 text-right text-emerald-700">{fmtU(sum('paid_usd'))}</td>
              </tr>
            </tfoot>
          </table>
          <div className="px-3 py-2 bg-amber-50 border-t text-xs text-amber-700">
            ბალანსის ფაილებიდან: <strong>A1</strong> — ფაზა · <strong>E სვეტი</strong> — ინვოისის თანხა
            (გამწვანებული = მიღებული და შემოწმებული, თეთრი = ჯერ არ მოსულა) ·
            <strong> F სვეტი</strong> — გამწვანებული „ok" = გადახდილი, ყვითელი = გადასახდელი.
            <strong> ფაზა</strong> ფერზე მაღლა დგას: ფაზა 2 = ყველა ინვოისი მიღებულია,
            ფაზა 3 = მიღებულიც და სრულად გადახდილიც.
            <strong> მდგომარეობით</strong> — ხარჯი დღეებზეა გაწერილი (სასტუმრო ღამეებზე, კვება იმ დღეს),
            ამიტომ თარიღზე გადამდები ტურიდან მხოლოდ გაწეული ნაწილი ითვლება.
            <strong> ≈ სტატისტიკით</strong> — ფაზა 1-ზე თითოეული მოუსვლელი ინვოისი ფასდება იმავე
            პოზიციის საშუალოთი დახურული ტურებიდან: ჯერ იმავე სერიიდან, თუ იქ არ მოიძებნა — ყველა სერიიდან.
            ფასი ჯგუფის ზომაზეა გადათვლილი (კვება 1 სტუმარზე, სასტუმრო 1 ოთახზე, ავტობუსი და გიდი ტურზე),
            ამიტომ პატარა ჯგუფზე ნაკლები გამოდის. უცნობი მომწოდებლის შემთხვევაში ფურცლის თანხა რჩება.
          </div>
        </div>
        )}
      </>
      )}
    </div>
  );
}

    Promise.all([
      fetch(`${API}/payment-terms`).then(r => r.json()),
      fetch(`${API}/vendors`).then(r => r.json()),
    ]).then(([t, v]) => { setTerms(t); setVendors(v); setLoading(false); })
      .catch(() => setLoading(false));
  };
  useEffect(() => { loadAll(); }, []);

  const save = () => {
    if (!form.vendor_name.trim()) return;
    setSaving(true);
    fetch(`${API}/payment-terms`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({...form, days_offset: parseInt(form.days_offset) || 0, unit_price: parseFloat(form.unit_price) || 0}),
    }).then(() => { loadAll(); setForm(EMPTY); setEditId(null); setSaving(false); });
  };

  const del = id => {
    fetch(`${API}/payment-terms/${id}`, {method:'DELETE'}).then(() => loadAll());
  };

  const startEdit = t => {
    setForm({vendor_name:t.vendor_name, vendor_type:t.vendor_type, timing:t.timing, days_offset:t.days_offset, notes:t.notes||'', unit_price:t.unit_price||0, currency:t.currency||'GEL', series_prices:t.series_prices||''});
    setEditId(t.id);
  };

  const allVendors = [...vendors.hotels.map(h => ({n:h, t:'hotel'})), ...vendors.restaurants.map(r => ({n:r, t:'restaurant'}))];

  return (
    <div className="p-4 max-w-screen-xl mx-auto">
      <div className="bg-white rounded-lg shadow p-5 mb-6">
        <h3 className="font-bold text-base mb-4">{editId ? 'ვენდორის რედაქტირება' : 'ვენდორის დამატება'}</h3>
        <div className="grid grid-cols-1 md:grid-cols-5 gap-3 mb-3">
          <div className="md:col-span-2">
            <label className="text-xs text-gray-500 mb-1 block">სასტუმრო / რესტ. სახელი</label>
            <input list="vendor-list" value={form.vendor_name}
              onChange={e => setForm(f => ({...f, vendor_name: e.target.value}))}
              placeholder="მაგ: Pullman Tbilisi"
              className="border rounded px-3 py-2 text-sm w-full"/>
            <datalist id="vendor-list">
              {allVendors.map(v => <option key={v.n} value={v.n} label={v.t === 'hotel' ? '🏨 '+v.n : '🍽️ '+v.n}/>)}
            </datalist>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">ტიპი</label>
            <select value={form.vendor_type} onChange={e => setForm(f => ({...f, vendor_type: e.target.value}))}
              className="border rounded px-3 py-2 text-sm w-full">
              <option value="hotel">🏨 სასტუმრო</option>
              <option value="restaurant">🍽️ რესტ.</option>
              <option value="other">👤 სხვა</option>
            </select>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">გადახდის დრო</label>
            <select value={form.timing} onChange={e => setForm(f => ({...f, timing: e.target.value}))}
              className="border rounded px-3 py-2 text-sm w-full">
              <option value="before">შეს./ჭამ.-მდე</option>
              <option value="after">მომს. შემდეგ</option>
            </select>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">რამდენი დღით</label>
            <div className="flex items-center gap-2">
              <input type="number" value={form.days_offset} min="0" max="90"
                onChange={e => setForm(f => ({...f, days_offset: e.target.value}))}
                className="border rounded px-3 py-2 text-sm w-20"/>
              <span className="text-sm text-gray-500">დღე</span>
            </div>
          </div>
          <div>
            <label className="text-xs text-gray-500 mb-1 block">ფასი (ერთ. / ბინა)</label>
            <div className="flex gap-1">
              <input type="number" value={form.unit_price} min="0" step="0.01"
                onChange={e => setForm(f => ({...f, unit_price: e.target.value}))}
                className="border rounded px-2 py-2 text-sm w-24"/>
              <select value={form.currency} onChange={e => setForm(f => ({...f, currency: e.target.value}))}
                className="border rounded px-2 py-2 text-sm">
                <option value="GEL">₾</option>
                <option value="USD">$</option>
              </select>
            </div>
          </div>
        </div>
        <div className="flex gap-3">
          <input value={form.notes} onChange={e => setForm(f => ({...f, notes: e.target.value}))}
            placeholder="შენიShvna (სურვ.)..."
            className="border rounded px-3 py-2 text-sm flex-1"/>
          <button onClick={save} disabled={saving || !form.vendor_name.trim()}
            className="px-5 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 disabled:opacity-50 font-medium">
            {saving ? '...' : editId ? 'განახლება' : 'დამატება'}
          </button>
          {editId && <button onClick={() => { setForm(EMPTY); setEditId(null); }}
            className="px-4 py-2 bg-gray-200 rounded text-sm hover:bg-gray-300">გაუქმება</button>}
        </div>
      </div>

      <div className="bg-white rounded-lg shadow overflow-hidden">
        <div className="px-4 py-3 border-b bg-gray-50 flex items-center justify-between">
          <span className="font-semibold text-sm">გადახდის პირობები ({terms.length})</span>
          <span className="text-xs text-gray-500">სასტ./რესტ. სახელი უნდა ემთხვეოდეს DB-ში</span>
        </div>
        {loading ? <Spinner/> : terms.length === 0 ? (
          <div className="text-center py-10 text-gray-400 text-sm">პირობები არ არის. დაამატე ზემოთ.</div>
        ) : (
          <table className="w-full text-sm">
            <thead className="border-b bg-gray-50">
              <tr>
                {['ვენდორი','ტიპი','გადახდა','დღე','ფასი','შენ.',''].map(h => (
                  <th key={h} className="text-left px-4 py-2 text-xs font-semibold text-gray-500">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {terms.map(t => (
                <tr key={t.id} className={`border-b hover:bg-gray-50 ${editId===t.id ? 'bg-blue-50' : ''}`}>
                  <td className="px-4 py-2.5 font-medium">{t.vendor_name}</td>
                  <td className="px-4 py-2.5">
                    <span className={`px-2 py-0.5 rounded text-xs ${t.vendor_type==='hotel'?'bg-blue-100 text-blue-700':t.vendor_type==='other'?'bg-purple-100 text-purple-700':'bg-orange-100 text-orange-700'}`}>
                      {t.vendor_type==='hotel'?'🏨 სასტ.':t.vendor_type==='other'?'👤 სხვა':'🍽️ რესტ.'}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 text-gray-600 text-xs">
                    <span className={`px-2 py-0.5 rounded ${t.timing==='before'?'bg-purple-100 text-purple-700':'bg-green-100 text-green-700'}`}>
                      {t.timing==='before'?'შეს.-მდე':'შემდეგ'}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 font-bold text-gray-700">{t.days_offset} დღ.</td>
                  <td className="px-4 py-2.5 text-sm font-semibold text-emerald-700">
                    {t.unit_price > 0
                      ? (t.vendor_type==='hotel'
                          ? `${t.currency==='USD'?'$':'₾'}${(t.unit_price*10).toFixed(0)}`
                          : `${t.currency==='USD'?'$':'₾'}${t.unit_price}`)
                      : '—'}
                  </td>
                  <td className="px-4 py-2.5 text-gray-400 text-xs max-w-xs truncate">{t.notes||'—'}</td>
                  <td className="px-4 py-2.5 flex gap-2">
                    <button onClick={() => startEdit(t)} className="text-blue-400 hover:text-blue-600 text-xs">✏️</button>
                    <button onClick={() => del(t.id)} className="text-red-400 hover:text-red-600 text-xs">✕</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <div className="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-4 text-xs text-amber-700">
        <strong>მნიშვნელოვანი:</strong> ვენდორის სახელი <strong>ზუსტად</strong> უნდა ემთხვეოდეს daily_log-ში შენახულ სახელს.
        მაგ: <code>Pullman Tbilisi</code>, <code>ხAReba</code>, <code>Marco Polo Gudauri</code>.
        Autocomplete-ში ჩანს DB-ში დაფიქსირებული სახელები.
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("day");
  const [selectedTour, setSelectedTour] = useState(null);
  const [syncing, setSyncing] = useState(false);

  const handleSelectTour = code => { setSelectedTour(code); setTab("detail"); };

  const handleFullSync = () => {
    setSyncing(true);
    Promise.all([
      fetch(`${API}/sync-schedule`, {method:'POST'}),
      fetch(`${API}/sync-profit`,   {method:'POST'}),
      fetch(`${API}/sync-hotels`,   {method:'POST'}),
      fetch(`${API}/sync-payment-status`, {method:'POST'}),
    ]).finally(() => window.location.reload());
  };

  const tabs = [
    {id:"timeline",   label:"📊 Timeline"},
    {id:"day",        label:"📅 დღის ხედი"},
    {id:"detail",     label:"🔍 ტურის დეტალი"},
    {id:"menu",       label:"🍽️ მენიუ"},
    {id:"payments",   label:"💳 წინასწარ გადასახდელი"},
    {id:"prepaystat", label:"📈 წინასტატი"},
    {id:"buses",      label:"🚌 ავტობუსები"},
    {id:"cashflow",   label:"💵 ავანსი/ბალანსი"},
    {id:"profit",     label:"💰 მოგება 2026"},
    {id:"stats",      label:"📊 სტატისტიკა 2026"},
    {id:"debts",      label:"🧾 დავალიანებები"},
    {id:"profit25",   label:"💰 მოგება 2025"},
    {id:"stats25",    label:"📊 სტატისტიკა 2025"},
    {id:"settings",   label:"⚙️ პარამეტრები"},
  ];

  return (
    <div className="min-h-screen bg-gray-100">
      <header className="bg-slate-900 text-white shadow-lg">
        <div className="max-w-screen-xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
          <div>
            <div className="font-bold text-lg">ki.360</div>
          </div>
          <div className="flex items-center gap-3">
            <div className="text-xs text-slate-400">
              {new Date().toLocaleDateString("ka-GE",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
            </div>
            <button onClick={handleFullSync} disabled={syncing}
              className="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-amber-400 text-slate-900 hover:bg-amber-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1.5">
              <span className={syncing ? "animate-spin inline-block" : ""}>🔄</span>
              {syncing ? "განახლება..." : "განახლება"}
            </button>
          </div>
        </div>
        <div className="border-t border-slate-700">
          <div className="max-w-screen-xl mx-auto px-4 flex flex-wrap">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-5 py-3 text-sm font-medium transition-colors ${
                  tab === t.id ? "border-b-2 border-amber-400 text-white" : "text-slate-400 hover:text-white"
                }`}>{t.label}</button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-screen-xl mx-auto">
        {tab === "timeline"   && <TimelineView onSelectTour={handleSelectTour}/>}
        {tab === "day"        && <DayView onSelectTour={handleSelectTour}/>}
        {tab === "detail"     && <TourDetailView initialCode={selectedTour} onBack={() => setTab("day")}/>}
        {tab === "menu"       && <MenuView/>}
        {tab === "payments"   && <PaymentsView/>}
        {tab === "prepaystat" && <PrepayStatsView/>}
        {tab === "buses"      && <BusView/>}
        {tab === "cashflow"   && <CashFlowView/>}
        {tab === "profit"     && <ProfitView/>}
        {tab === "stats"      && <StatsView/>}
        {tab === "debts"      && <DebtsView/>}
        {/* 2025 is a closed season read from the archived balance workbooks:
            the same two views, pointed at the archive. */}
        {tab === "profit25"   && <ProfitView src="/archive-profit?year=2025"
                                             syncPath="/sync-archive" toursSrc={null}
                                             colors={ARCHIVE_SERIES_COLORS}/>}
        {tab === "stats25"    && <StatsView src="/archive-profit?year=2025"
                                            syncPath="/sync-archive"
                                            colors={ARCHIVE_SERIES_COLORS}/>}
        {tab === "settings"   && <SettingsView/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
